<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mogu room</title>
<style>
:root{
  --bg:#f8f8f4; --panel:#f1f1ec; --panel-2:#f7f7f2; --text:#33413a; --sub:#7e887f;
  --line:#e0e3db; --mint:#a8d0ad; --mint-deep:#7faa84; --mint-soft:#e7efe4;
  --yellow:#d7c56f; --yellow-soft:#efe7b7; --red:#d89a88; --red-soft:#efc2b7;
  --button:#edf2e7; --button-2:#d2e6d8; --button-3:#dce7ea;
  --shadow:0 8px 24px rgba(43,57,45,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif}
body{min-height:100dvh}
button,input,select{font:inherit}
button{border:0;background:none;color:inherit;padding:0}
img{display:block;max-width:100%}
.hidden{display:none !important}
.app{max-width:480px;margin:0 auto;min-height:100dvh;padding:18px 16px calc(92px + env(safe-area-inset-bottom));}
.page{display:none}
.page.active{display:block}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;}
.nickname{font-size:20px;font-weight:900;line-height:1.2;word-break:break-all;max-width:40%}
.kcal-wrap{display:flex;align-items:center;gap:10px;flex-shrink:0}
.kcal{font-size:20px;font-weight:900;white-space:nowrap}
.soft-btn{padding:12px 16px;background:var(--panel);border-radius:18px;font-weight:800;color:#7c847c;white-space:nowrap}
.gauge-shell{margin-top:14px}
.gauge{position:relative;height:28px;border-radius:999px;background:#d9ddd5;overflow:hidden}
.gauge-fill{position:absolute;left:0;top:0;bottom:0;width:100%;clip-path:inset(0 100% 0 0);background:linear-gradient(90deg,var(--mint) 0 var(--b1), var(--yellow) var(--b1) var(--b2), var(--red) var(--b2) 100%);transition:clip-path .25s ease}
.boundary{position:absolute;top:4px;bottom:4px;border-left:3px dotted rgba(72,80,74,.55);z-index:2}
.gauge-legend{position:relative;height:58px;margin-top:10px}
.zone-label{position:absolute;transform:translateX(-50%);text-align:center;min-width:92px}
.zone-label .main{font-size:12px;font-weight:900;color:var(--sub)}
.zone-label .sub{font-size:10px;line-height:1.35;color:#8c948e;margin-top:2px;white-space:nowrap}
.center-stage{display:flex;flex-direction:column;align-items:center;padding-top:2px}
.speech{position:relative;max-width:250px;background:#f2f2ee;border:1px solid #e8e7e1;color:#667067;padding:11px 16px;border-radius:18px;font-size:15px;font-weight:800;line-height:1.35;text-align:center;box-shadow:var(--shadow);margin:0 0 0}
.speech:after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%) rotate(45deg);width:14px;height:14px;background:#f2f2ee;border-right:1px solid #e8e7e1;border-bottom:1px solid #e8e7e1}
.pet-wrap{display:flex;justify-content:center;align-items:center;width:100%;min-height:410px;margin-top:-2px;position:relative}
.pet-card{position:relative;display:flex;align-items:flex-end;justify-content:center}
.pet-img{width:min(76vw,320px);height:auto;object-fit:contain;transform-origin:center bottom;transition:transform .25s ease}
.bottom-panel{margin-top:8px}
.card{background:var(--panel);border-radius:26px;padding:16px;box-shadow:var(--shadow)}
.food-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:17px;font-weight:900}
.food-tray{display:flex;gap:12px;min-height:92px;overflow:auto;padding-bottom:2px}
.food-piece{width:78px;height:78px;border-radius:22px;background:rgba(255,255,255,.78);box-shadow:inset 0 0 0 1px #e7e7e1;display:grid;place-items:center;flex:0 0 auto;cursor:pointer;transition:transform .15s ease}
.food-piece:active{transform:scale(.96)}
.empty{min-height:78px;display:flex;align-items:center;color:#8a938c;font-size:14px;line-height:1.55}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.action-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:22px 10px;border-radius:22px;font-size:20px;font-weight:900;box-shadow:var(--shadow)}
.action-btn.food{background:#e8ecdd}
.action-btn.exercise{background:#bcd8c3}
.action-btn .icon{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:rgba(248,248,244,.96);backdrop-filter:blur(8px);border-top:1px solid #ebebe4;padding:10px 18px calc(10px + env(safe-area-inset-bottom));z-index:20}
.nav-inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.nav-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 4px;border-radius:14px;color:#969e98;font-size:15px;font-weight:800}
.nav-btn.active{color:#6d9872}
.nav-btn svg{width:22px;height:22px;flex:0 0 22px}
.section{background:var(--panel);border-radius:24px;padding:18px 16px;box-shadow:var(--shadow);margin-top:12px;overflow:hidden}
.section h2{margin:0 0 12px;font-size:18px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.wide{grid-column:1 / -1}
.field label{font-size:13px;font-weight:800;color:#6e7770}
.field input,.field select{width:100%;height:48px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:0 14px;font-size:16px;color:var(--text);min-width:0}
.submit{margin-top:14px;width:100%;height:52px;border-radius:18px;background:#dce7d8;font-size:17px;font-weight:900}
.helper{font-size:12px;line-height:1.5;color:#88918b;margin-top:10px;word-break:break-word}
.pet-picker{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pet-option{display:flex;align-items:center;gap:10px;padding:10px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1px #e7e7e1;text-align:left}
.pet-option.selected{background:#f7fbf6;box-shadow:inset 0 0 0 2px #a9c8ad}
.pet-thumb{width:80px;height:80px;object-fit:contain;flex:0 0 80px}
.pet-option .name{font-size:15px;font-weight:900;line-height:1.35;word-break:break-word}
.list{display:flex;flex-direction:column;gap:10px}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px #ecece6}
.list-item .meta{font-size:13px;color:#8a928c}
.modal{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(31,38,33,.32);padding:12px;z-index:30}
.modal.show{display:flex}
.sheet{width:min(480px,100%);background:var(--bg);border-radius:28px 28px 18px 18px;padding:18px 16px 20px;box-shadow:0 -10px 34px rgba(0,0,0,.12)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-head h3{margin:0;font-size:18px}
.close{padding:10px 14px;border-radius:14px;background:var(--panel);font-weight:800;color:#7b837c}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice-btn{padding:14px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1px #e6e8e1;text-align:left}
.choice-btn.active{background:#f5faf4;box-shadow:inset 0 0 0 2px #a7c5aa}
.choice-title{display:flex;align-items:center;gap:8px;font-weight:900;font-size:15px}
.choice-sub{margin-top:6px;font-size:13px;color:#839086;line-height:1.4}
.stepper{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 0}
.stepper button{width:40px;height:40px;border-radius:14px;background:var(--panel);font-size:22px;font-weight:900}
.stepper input{width:72px;height:44px;text-align:center;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:18px;font-weight:800}
.primary{margin-top:16px;width:100%;height:52px;border-radius:18px;background:#bfd8c5;font-size:17px;font-weight:900}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(94px + env(safe-area-inset-bottom));background:#38423b;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:35}
.toast.show{opacity:1}
@media (max-width:390px){
  .app{padding-left:12px;padding-right:12px}
  .nickname{font-size:18px;max-width:38%}
  .kcal{font-size:18px}
  .soft-btn{padding:10px 13px}
  .pet-wrap{min-height:360px}
  .pet-img{width:min(74vw,285px)}
  .field-grid{grid-template-columns:1fr}
  .pet-picker{grid-template-columns:1fr}
  .choice-grid{grid-template-columns:1fr}
}

/* iPhone one-screen home: header, character, food and actions remain within visual viewport. */
html,body{width:100%;height:100%;overflow-x:hidden}
.app{height:100dvh;min-height:0;max-width:480px;overflow:hidden;padding:10px 16px calc(68px + env(safe-area-inset-bottom))}
.page{display:none;min-width:0;max-width:100%}
.page.active:not(#page-home){display:block;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:20px}
#page-home.active{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;height:100%;min-height:0;gap:5px;overflow:hidden}
.top-row{margin-top:0;gap:8px;min-width:0}
.nickname{font-size:17px;font-weight:750;min-width:0;max-width:39%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcal{font-size:17px;font-weight:750}
.soft-btn{padding:8px 12px;border-radius:14px;font-size:13px;font-weight:700}
.gauge-shell{margin-top:2px;min-height:0}
.gauge{height:19px}
.gauge-legend{height:24px;margin-top:6px}
.zone-label{min-width:0;width:auto;white-space:nowrap;transform:translateX(-50%)}
.zone-label .main{font-size:12px;font-weight:650}
#loseLabel{left:0!important;transform:none}
#gainLabel{left:100%!important;transform:translateX(-100%)}
.gauge-ranges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;background:#f1f2ec;border-radius:12px;padding:5px 8px;margin-top:2px}
.gauge-ranges .range-label{font-size:10px;line-height:1.2;font-weight:550;color:#748177;text-align:center;white-space:nowrap;min-width:0}
.gauge-ranges .range-label:first-child{text-align:left}
.gauge-ranges .range-label:last-child{text-align:right}
.center-stage{min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0;gap:4px}
.speech{max-width:240px;margin:0;padding:8px 14px;font-size:13px;font-weight:650;line-height:1.35;border-radius:15px;box-shadow:none;background:#f0f1eb;border:1px solid #dde2d9;color:#546359}
.speech:after{background:#f0f1eb;border-color:#dde2d9}
.pet-wrap{min-height:0;height:auto;margin:0;flex:1 1 auto;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pet-card{height:100%;max-width:100%;display:flex;justify-content:center;align-items:center}
.pet-img{height:100%;width:auto;max-width:min(73vw,270px);max-height:100%;object-fit:contain;transition:none}
.bottom-panel{margin-top:0;min-width:0}
.card{border-radius:18px;padding:10px 12px;box-shadow:none}
.food-head{font-size:14px;margin-bottom:5px;font-weight:700}
.food-tray{min-height:54px;max-height:62px;gap:7px}
.food-piece{width:55px;height:55px;border-radius:13px}
.food-piece svg{width:48px;height:48px}
.empty{min-height:54px;font-size:12px}
.action-row{gap:10px;margin-top:8px}
.action-btn{padding:10px 8px;min-height:48px;border-radius:15px;font-size:16px;font-weight:720;box-shadow:none}
.action-btn .icon{width:21px;height:21px}
.action-btn svg{width:21px;height:21px}
.bottom-nav{padding:6px 18px calc(6px + env(safe-area-inset-bottom));height:calc(58px + env(safe-area-inset-bottom));box-sizing:border-box}
.nav-btn{padding:8px 3px;font-size:13px;font-weight:650;gap:6px}
.nav-btn svg{width:19px;height:19px}
.page.active:not(#page-home) .section{min-width:0}
.field-grid,.pet-picker,.choice-grid{grid-template-columns:repeat(2,minmax(0,1fr));min-width:0}
.field,.pet-option,.choice-btn,.field input,.field select{min-width:0;max-width:100%}
@media(max-width:370px){
 .app{padding-left:12px;padding-right:12px}
 .nickname{font-size:15px}
 .kcal{font-size:15px}
 .gauge-ranges{padding:5px 4px}
 .gauge-ranges .range-label{font-size:9px}
 .pet-picker{grid-template-columns:minmax(0,1fr)}
}
@media(max-height:650px){
 .app{padding-top:5px}
 .speech{font-size:12px;padding:6px 10px}
 .food-tray{min-height:45px;max-height:52px}
 .food-piece{width:48px;height:48px}
 .action-btn{min-height:42px;padding:7px}
}

/* Compact multiplier: × ◀ 1 ▶ */
.stepper{justify-content:center;gap:6px}
.stepper-symbol{font-size:22px;font-weight:650;color:#67706a;margin-right:6px;line-height:1}
.stepper .stepper-arrow{width:38px;height:42px;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;color:#52695b;touch-action:manipulation}
.stepper .stepper-arrow:active{background:#e7ece5}
.stepper .stepper-arrow svg{width:18px;height:18px}
.stepper #exerciseCount{width:54px;height:42px;font-size:22px;font-weight:750;border:0;box-shadow:none;background:transparent;padding:0;caret-color:transparent;pointer-events:none}
</style>
</head>
<body>
<div class="app">
  <section class="page active" id="page-home">
    <div class="top-row">
      <div class="nickname" id="nicknameLabel">ニックネーム</div>
      <div class="kcal-wrap">
        <div class="kcal"><span id="netKcal">0</span> kcal</div>
        <button class="soft-btn" id="resetBtn" type="button">リセット</button>
      </div>
    </div>

    <div class="gauge-shell">
      <div class="gauge" id="gauge">
        <div class="gauge-fill" id="gaugeFill"></div>
        <div class="boundary" id="boundary1"></div>
        <div class="boundary" id="boundary2"></div>
      </div>
      <div class="gauge-legend" id="gaugeLegend">
        <div class="zone-label" id="loseLabel"><div class="main">減量</div></div>
        <div class="zone-label" id="maintainLabel"><div class="main">維持</div></div>
        <div class="zone-label" id="gainLabel"><div class="main">増量</div></div>
      </div>
    </div>

    <div class="center-stage">
      <div class="speech" id="speech">タップしておしゃべり</div>
      <div class="pet-wrap">
        <div class="pet-card">
          <img id="petImage" class="pet-img" src="" alt="キャラクター">
        </div>
      </div>
    </div>

    <div class="bottom-panel">
      <div class="card">
        <div class="food-head"><span>エサ</span><span id="foodCount">0個</span></div>
        <div class="food-tray" id="foodTray"></div>
      </div>
      <div class="action-row">
        <button class="action-btn food" id="openFoodBtn" type="button"><span class="icon" id="foodBtnIcon"></span><span>ごはん</span></button>
        <button class="action-btn exercise" id="openExerciseBtn" type="button"><span class="icon" id="exerciseBtnIcon"></span><span>運動</span></button>
      </div>
    </div>
  </section>

  <section class="page" id="page-logs">
    <div class="section">
      <h2>今日の食事</h2>
      <div class="list" id="mealList"></div>
    </div>
    <div class="section">
      <h2>今日の運動</h2>
      <div class="list" id="exerciseList"></div>
    </div>
    <div class="section">
      <h2>体重の記録</h2>
      <div class="field-grid">
        <div class="field wide">
          <label for="weightRecordInput">今日の体重 kg</label>
          <input id="weightRecordInput" inputmode="decimal" placeholder="50">
        </div>
      </div>
      <button class="submit" id="saveWeightBtn" type="button">体重を保存</button>
      <div class="list" id="weightList" style="margin-top:14px"></div>
    </div>
  </section>

  <section class="page" id="page-settings">
    <div class="section">
      <h2>プロフィール</h2>
      <div class="field-grid">
        <div class="field wide">
          <label for="nicknameInput">ニックネーム（10文字以内）</label>
          <input id="nicknameInput" maxlength="10" placeholder="ニックネーム">
        </div>
        <div class="field"><label for="heightInput">身長 cm</label><input id="heightInput" inputmode="numeric"></div>
        <div class="field"><label for="weightInput">体重 kg</label><input id="weightInput" inputmode="decimal"></div>
        <div class="field"><label for="ageInput">年齢</label><input id="ageInput" inputmode="numeric"></div>
        <div class="field"><label for="sexInput">性別（計算用）</label><select id="sexInput"><option value="female">女性</option><option value="male">男性</option></select></div>
        <div class="field wide"><label for="activityInput">活動量</label><select id="activityInput"><option value="1.2">少ない</option><option value="1.375">やや少ない</option><option value="1.55">ふつう</option><option value="1.725">多い</option></select></div>
      </div>
      <button class="submit" id="saveProfileBtn" type="button">目安を更新</button>
      <div class="helper" id="targetSummary">減量 / 維持 / 増量 の目安がここに表示されるよ</div>
    </div>

    <div class="section">
      <h2>キャラを選ぶ</h2>
      <div class="pet-picker" id="petPicker"></div>
    </div>
  </section>
</div>

<nav class="bottom-nav">
  <div class="nav-inner">
    <button class="nav-btn active" data-page="home" type="button"><span class="icon" id="navHomeIcon"></span><span>ホーム</span></button>
    <button class="nav-btn" data-page="logs" type="button"><span class="icon" id="navLogsIcon"></span><span>記録</span></button>
    <button class="nav-btn" data-page="settings" type="button"><span class="icon" id="navSettingsIcon"></span><span>設定</span></button>
  </div>
</nav>

<div class="modal" id="foodModal">
  <div class="sheet">
    <div class="sheet-head"><h3>ごはんを記録</h3><button class="close" data-close type="button">閉じる</button></div>
    <div class="field">
      <label for="foodCalInput">摂取カロリー kcal</label>
      <input id="foodCalInput" inputmode="numeric" placeholder="500">
    </div>
    <div class="helper">入力したカロリーに応じて、エサが自動で分かれてホームに並ぶよ。</div>
    <button class="primary" id="saveFoodBtn" type="button">エサを作る</button>
  </div>
</div>

<div class="modal" id="exerciseModal">
  <div class="sheet">
    <div class="sheet-head"><h3>運動を記録</h3><button class="close" data-close type="button">閉じる</button></div>
    <div class="choice-grid" id="exerciseChoices"></div>
    <div class="stepper" role="group" aria-label="運動時間の倍率">
      <span class="stepper-symbol" aria-hidden="true">×</span>
      <button id="minusCount" class="stepper-arrow" type="button" aria-label="倍率を1減らす"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5 7 12l9 7Z" fill="currentColor"/></svg></button>
      <input id="exerciseCount" type="text" value="1" inputmode="none" readonly aria-label="10分単位の倍率">
      <button id="plusCount" class="stepper-arrow" type="button" aria-label="倍率を1増やす"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 9 7-9 7Z" fill="currentColor"/></svg></button>
    </div>
    <button class="primary" id="saveExerciseBtn" type="button">運動を追加</button>
  </div>
</div>

<div class="toast" id="toast"></div>

function defaultState() {

    date: today(),

    foodPieces: [],
    meals: [],
    feedings: [],

    weights: [],
    selectedExercise: 'walk',
    exerciseCount: 1,
    bubble: 'タップしておしゃべり'
  };
}
function load() {
 try {
  const base=defaultState();
  const current=localStorage.getItem(STORAGE_KEY);
  const previous=current || localStorage.getItem('mogu-room-pixel-v2');
  if(!previous) return base;
  const parsed=JSON.parse(previous);
  const migratedProfile={...base.profile,...(parsed.profile||{})};
  if(!current && typeof parsed.nickname==='string') migratedProfile.nickname=parsed.nickname;
  const petIndex=Math.max(0,Math.min(3,Number(parsed.petIndex)||0));
  return {...base,...parsed,petIndex,profile:migratedProfile,targets:null};
 } catch(e) {return defaultState();}
}
let state = load();
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function clearDaily() { state.foodPieces=[]; state.meals=state.meals.filter(x=>x.date!==today()); state.feedings=state.feedings.filter(x=>x.date!==today()); state.exercises=state.exercises.filter(x=>x.date!==today()); state.bubble='タップしておしゃべり'; }
function ensureDay() { if(state.date!==today()) { state.date=today(); clearDaily(); save(); renderAll(); } }
function calcTargets() { const p=state.profile; const h=Number(p.height), w=Number(p.weight), age=Number(p.age), act=Number(p.activity); if(!(h&&w&&age&&act)) return null; const bmr=p.sex==='male' ? 10*w + 6.25*h - 5*age + 5 : 10*w + 6.25*h - 5*age - 161; const maintain=Math.round(bmr*act); return { lose:[Math.round(maintain-500), Math.round(maintain-150)], maintain:[Math.round(maintain-149), Math.round(maintain+149)], gain:[Math.round(maintain+150), Math.round(maintain+500)] }; }
function fedCalories() { return state.feedings.filter(x=>x.date===today()).reduce((a,b)=>a+b.kcal,0); }
function exerciseCalories() { return state.exercises.filter(x=>x.date===today()).reduce((a,b)=>a+b.burn,0); }
function netCalories() { return Math.max(0, fedCalories() - exerciseCalories()); }
function bodyStage() { const t=state.targets, n=netCalories(); if(!t) return 'normal'; if(n===0) return 'normal'; if(n<t.lose[0]) return 'thin2'; if(n<t.lose[1]) return 'thin1'; if(n<=t.maintain[1]) return 'normal'; if(n<t.gain[0] + (t.gain[1]-t.gain[0])/3) return 'chubby1'; if(n<t.gain[0] + (t.gain[1]-t.gain[0])*2/3) return 'chubby2'; return 'chubby3'; }
function stageTransform(stage) { return {thin2:'scale(.92,1.02)',thin1:'scale(.97,1.01)',normal:'scale(1)',chubby1:'scale(1.06,.99)',chubby2:'scale(1.12,.98)',chubby3:'scale(1.18,.97)'}[stage] || 'scale(1)'; }
function chooseFoods(kcal) {
  let remaining=kcal; const out=[]; const sorted=[...FOODS].sort((a,b)=>b.kcal-a.kcal);
  while(remaining>0 && out.length<6) { let pick=sorted.find(x=>x.kcal<=remaining+30); if(!pick) pick=sorted[sorted.length-1]; out.push({key:pick.key,kcal:Math.min(pick.kcal,remaining)}); remaining -= pick.kcal; if(remaining<60) break; }
  if(remaining>0 && out.length<7) { const pick=remaining<=110 ? FOODS.find(x=>x.key==='salad') : remaining<=150 ? FOODS.find(x=>x.key==='milk') : FOODS.find(x=>x.key==='onigiri'); out.push({key:pick.key,kcal:remaining}); }
  return out;
}
function petSay(custom) { const pet=PETS[state.petIndex]; state.bubble = custom || pet.sayings[Math.floor(Math.random()*pet.sayings.length)]; save(); renderSpeech(); }
function renderSpeech() { q('#speech').textContent=state.bubble || 'タップしておしゃべり'; }
const CUTOUT_ASSETS={};
let cutoutsReady=false;
function makeMascotCutout(src){
 return new Promise(resolve=>{
  const original=new Image();
  original.onload=()=>{
   try{
    const size=600,ratio=Math.min(1,size/Math.max(original.naturalWidth,original.naturalHeight));
    const w=Math.max(1,Math.round(original.naturalWidth*ratio));
    const h=Math.max(1,Math.round(original.naturalHeight*ratio));
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const cx=c.getContext('2d',{willReadFrequently:true});
    cx.drawImage(original,0,0,w,h);
    const img=cx.getImageData(0,0,w,h),a=img.data;
    const seen=new Uint8Array(w*h),queue=new Int32Array(w*h),isBg=(pos)=>{
      const k=pos*4,r=a[k],g=a[k+1],b=a[k+2];
      // Warm white/cream outside the dark-brown character contour.
      // Border-connected removal preserves enclosed light-colored faces and bellies.
      return r>193&&g>188&&b>177&&Math.max(r,g,b)-Math.min(r,g,b)<64;
    };
    let head=0,tail=0;
    function add(p){
      if(seen[p]||!isBg(p))return;
      seen[p]=1;queue[tail++]=p;
    }
    for(let x=0;x<w;x++){add(x);add((h-1)*w+x);}
    for(let y=0;y<h;y++){add(y*w);add(y*w+w-1);}
    while(head<tail){
      const p=queue[head++],x=p%w,y=(p-x)/w,k=p*4;
      a[k+3]=0;
      if(x>0)add(p-1);if(x<w-1)add(p+1);
      if(y>0)add(p-w);if(y<h-1)add(p+w);
    }
    // Trim the transparent exterior, leaving only a small breathing margin.
    let minX=w,minY=h,maxX=-1,maxY=-1;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      if(a[(y*w+x)*4+3]<20)continue;
      minX=Math.min(minX,x);maxX=Math.max(maxX,x);
      minY=Math.min(minY,y);maxY=Math.max(maxY,y);
    }
    cx.putImageData(img,0,0);
    if(maxX<0){resolve(src);return;}
    const margin=8,x0=Math.max(0,minX-margin),y0=Math.max(0,minY-margin);
    const width=Math.min(w-x0,maxX-minX+1+margin*2);
    const height=Math.min(h-y0,maxY-minY+1+margin*2);
    const out=document.createElement('canvas');out.width=width;out.height=height;
    out.getContext('2d').drawImage(c,x0,y0,width,height,0,0,width,height);
    resolve(out.toDataURL('image/webp',0.92));
   }catch(e){resolve(src)}
  };
  original.onerror=()=>resolve(src);
  original.src=src;
 });
}
function prepareMascotImages(){
 Promise.all(PETS.map(async pet=>{
  CUTOUT_ASSETS[pet.key]=await makeMascotCutout(ASSETS[pet.key]);
 })).then(()=>{
  cutoutsReady=true;
  renderPet();renderPetPicker();
 });
}
function renderPet() {
 const pet=PETS[state.petIndex],img=q('#petImage');
 img.src=CUTOUT_ASSETS[pet.key]||ASSETS[pet.key];
 img.alt=pet.name;
 // Never stretch approved illustrations; future body states require dedicated approved assets.
 img.style.transform='none';
}
function renderTray() { const tray=q('#foodTray'); q('#foodCount').textContent=`${state.foodPieces.length}個`; if(!state.foodPieces.length) { tray.innerHTML='<div class="empty">ごはんを記録するとエサがここに並ぶよ</div>'; return; } tray.innerHTML=''; state.foodPieces.forEach((piece,idx)=>{ const btn=document.createElement('button'); btn.type='button'; btn.className='food-piece'; btn.setAttribute('aria-label','エサ'); btn.innerHTML=iconFood(piece.key); btn.addEventListener('click',()=>feedPiece(idx)); tray.appendChild(btn); }); }
function feedPiece(idx) { const piece=state.foodPieces.splice(idx,1)[0]; if(!piece) return; state.feedings.push({date:today(), time:nowTime(), kcal:piece.kcal}); state.bubble='もぐもぐしたよ。'; save(); renderAll(); }
function renderGauge() { const t=state.targets || calcTargets(); state.targets=t; const n=netCalories(); q('#netKcal').textContent=n; q('#nicknameLabel').textContent = state.profile.nickname || 'ニックネーム'; if(!t) return; const max=Math.max(1, t.gain[1]); const fillPct=Math.min(100, (n/max)*100); const b1=(t.maintain[0]/max)*100; const b2=(t.maintain[1]/max)*100; q('#gaugeFill').style.clipPath = 'inset(0 '+(100-fillPct)+'% 0 0)'; q('#gauge').style.setProperty('--b1', `${Math.max(0,Math.min(100,b1))}%`); q('#gauge').style.setProperty('--b2', `${Math.max(0,Math.min(100,b2))}%`); q('#boundary1').style.left = `${b1}%`; q('#boundary2').style.left = `${b2}%`; const loseMid = ((t.lose[0]+t.lose[1])/2)/max*100; const maintainMid = ((t.maintain[0]+t.maintain[1])/2)/max*100; const gainMid = ((t.gain[0]+t.gain[1])/2)/max*100; q('#loseLabel').style.left='0%'; q('#maintainLabel').style.left=`${maintainMid}%`; q('#gainLabel').style.left='100%'; q('#targetSummary').textContent = `減量 ${t.lose[0]}〜${t.lose[1]} kcal / 維持 ${t.maintain[0]}〜${t.maintain[1]} kcal / 増量 ${t.gain[0]}〜${t.gain[1]} kcal`; }
function renderLogs() { const meals=state.meals.filter(x=>x.date===today()); const exercises=state.exercises.filter(x=>x.date===today()); q('#mealList').innerHTML = meals.length ? meals.slice().reverse().map(x=>`<div class="list-item"><div><div style="font-weight:900">${x.kcal} kcal</div><div class="meta">${x.time}</div></div><div class="meta">食事</div></div>`).join('') : '<div class="list-item"><span class="meta">まだ記録がないよ</span></div>'; q('#exerciseList').innerHTML = exercises.length ? exercises.slice().reverse().map(x=>`<div class="list-item"><div><div style="font-weight:900">${x.name}</div><div class="meta">${x.minutes}分</div></div><div class="meta">-${x.burn} kcal</div></div>`).join('') : '<div class="list-item"><span class="meta">まだ記録がないよ</span></div>'; q('#weightList').innerHTML = state.weights.length ? state.weights.slice().reverse().map(x=>`<div class="list-item"><div style="font-weight:900">${x.weight} kg</div><div class="meta">${x.date}</div></div>`).join('') : '<div class="list-item"><span class="meta">まだ記録がないよ</span></div>'; }
function renderPetPicker() { const wrap=q('#petPicker'); wrap.innerHTML=''; PETS.forEach((pet,idx)=>{ const btn=document.createElement('button'); btn.type='button'; btn.className='pet-option'+(idx===state.petIndex?' selected':''); btn.innerHTML=`<img class="pet-thumb" src="${CUTOUT_ASSETS[pet.key]||ASSETS[pet.key]}" alt="${pet.name}"><div class="name">${pet.name}</div>`; btn.addEventListener('click',()=>{ state.petIndex=idx; save(); renderPetPicker(); renderPet(); petSay(); }); wrap.appendChild(btn); }); }
function renderProfile() { q('#nicknameInput').value=state.profile.nickname||''; q('#heightInput').value=state.profile.height; q('#weightInput').value=state.profile.weight; q('#ageInput').value=state.profile.age; q('#sexInput').value=state.profile.sex; q('#activityInput').value=state.profile.activity; }
function switchPage(page) { qa('.page').forEach(el=>el.classList.toggle('active', el.id===`page-${page}`)); qa('.nav-btn').forEach(el=>el.classList.toggle('active', el.dataset.page===page)); }
function openModal(id) { q(id).classList.add('show'); }
function closeModals() { qa('.modal').forEach(m=>m.classList.remove('show')); }
function saveFood() { ensureDay(); const kcal=Number(q('#foodCalInput').value); if(!(kcal>0)) { toast('カロリーを入力してね'); return; } const pieces=chooseFoods(kcal); state.meals.push({date:today(), time:nowTime(), kcal}); state.foodPieces.push(...pieces); q('#foodCalInput').value=''; state.bubble='エサを作ったよ。'; save(); closeModals(); renderAll(); }
function renderExerciseChoices() { const wrap=q('#exerciseChoices'); wrap.innerHTML=''; EXERCISES.forEach(ex=>{ const btn=document.createElement('button'); btn.type='button'; btn.className='choice-btn'+(ex.key===state.selectedExercise?' active':''); btn.innerHTML=`<div class="choice-title"><span style="width:20px;height:20px;display:inline-flex">${SVG.walk}</span><span>${ex.name}</span></div><div class="choice-sub">${ex.per10} kcal / 10分</div>`; btn.addEventListener('click',()=>{ state.selectedExercise=ex.key; save(); renderExerciseChoices(); renderExercisePreview(); }); wrap.appendChild(btn); }); }
function renderExercisePreview() { let count=Math.max(1, Number(q('#exerciseCount').value)||1); q('#exerciseCount').value=count; state.exerciseCount=count; const ex=EXERCISES.find(x=>x.key===state.selectedExercise) || EXERCISES[0]; /* Count displayed directly in the centered control. */ }
function saveExercise() { ensureDay(); const count=Math.max(1, Number(q('#exerciseCount').value)||1); const ex=EXERCISES.find(x=>x.key===state.selectedExercise) || EXERCISES[0]; state.exercises.push({date:today(), time:nowTime(), key:ex.key, name:ex.name, unit:ex.per10, count, minutes:count*10, burn:ex.per10*count}); state.bubble = ex.label; save(); closeModals(); renderAll(); }
function saveProfile() { const next={ nickname:(q('#nicknameInput').value || 'ニックネーム').slice(0,10), height:q('#heightInput').value || '150', weight:q('#weightInput').value || '50', age:q('#ageInput').value || '30', sex:q('#sexInput').value, activity:q('#activityInput').value }; const changed=!sameProfile(next,state.profile); state.profile=next; state.targets=calcTargets(); if(changed) clearDaily(); save(); renderAll(); toast(changed?'設定変更で今日の記録をリセットしたよ':'設定を更新したよ'); }
function saveWeight() { const value=q('#weightRecordInput').value; if(!value) { toast('体重を入力してね'); return; } state.weights=state.weights.filter(x=>x.date!==today()); state.weights.push({date:today(), weight:value}); if(String(state.profile.weight)!==String(value)) { state.profile.weight=String(value); q('#weightInput').value=String(value); state.targets=calcTargets(); clearDaily(); } save(); q('#weightRecordInput').value=''; renderAll(); toast('体重を保存したよ'); }
function resetToday() { if(confirm('今日のカロリーとエサをゼロにする？')) { clearDaily(); save(); renderAll(); } }
function renderAll() { ensureDay(); renderProfile(); renderPet(); renderSpeech(); renderTray(); renderGauge(); renderLogs(); renderPetPicker(); renderExerciseChoices(); renderExercisePreview(); }

q('#foodBtnIcon').appendChild(htmlToElement(SVG.bowl));
q('#exerciseBtnIcon').appendChild(htmlToElement(SVG.shoe));
q('#navHomeIcon').appendChild(htmlToElement(SVG.home));
q('#navLogsIcon').appendChild(htmlToElement(SVG.note));
q('#navSettingsIcon').appendChild(htmlToElement(SVG.gear));

q('#petImage').addEventListener('click',()=>petSay());
q('#speech').addEventListener('click',()=>petSay());
q('#openFoodBtn').addEventListener('click',()=>openModal('#foodModal'));
q('#openExerciseBtn').addEventListener('click',()=>openModal('#exerciseModal'));
q('#saveFoodBtn').addEventListener('click',saveFood);
q('#saveExerciseBtn').addEventListener('click',saveExercise);
q('#saveProfileBtn').addEventListener('click',saveProfile);
q('#saveWeightBtn').addEventListener('click',saveWeight);
q('#resetBtn').addEventListener('click',resetToday);
qa('[data-close]').forEach(btn=>btn.addEventListener('click',closeModals));
qa('.modal').forEach(mod=>mod.addEventListener('click',e=>{ if(e.target===mod) closeModals(); }));
qa('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>switchPage(btn.dataset.page)));
q('#minusCount').addEventListener('click',()=>{ q('#exerciseCount').value=Math.max(1, (Number(q('#exerciseCount').value)||1)-1); renderExercisePreview(); });
q('#plusCount').addEventListener('click',()=>{ q('#exerciseCount').value=Math.min(99, (Number(q('#exerciseCount').value)||1)+1); renderExercisePreview(); });
q('#exerciseCount').addEventListener('input',renderExercisePreview);
window.addEventListener('focus',ensureDay);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) ensureDay(); });
state.targets = state.targets || calcTargets();
renderAll();
prepareMascotImages();
</script>
</body>
