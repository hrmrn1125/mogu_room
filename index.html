<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>mogu room prototype</title>
<style>
:root{
  --bg:#ffffff; --panel:#fafaf8; --line:#e8e8e2; --text:#232323; --sub:#6c6c68;
  --accent:#7dbf7a; --accent2:#f1d778; --chip:#f5f5f2; --danger:#d78e8e;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button{cursor:pointer}
input,select{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 13px;color:var(--text)}
.app{max-width:460px;margin:0 auto;min-height:100%;padding:16px 16px 110px;background:#fff}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.title{font-size:21px;font-weight:800;letter-spacing:.02em}
.modechip{font-size:12px;color:var(--sub);background:var(--chip);padding:8px 11px;border-radius:999px}
.hero{position:relative;background:#fff;border-radius:28px;padding:16px 12px 10px;min-height:370px}
.stage{position:relative;background:#fff;border-radius:24px;display:flex;align-items:center;justify-content:center;height:310px;overflow:hidden}
.speech{position:absolute;top:8px;left:50%;transform:translateX(-50%);max-width:210px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 14px;font-size:13px;line-height:1.55;text-align:center;color:var(--sub)}
.speech:after{content:"";position:absolute;left:50%;bottom:-8px;width:14px;height:14px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.character-wrap{position:relative;width:220px;height:220px;display:grid;place-items:center}
#petSvg{width:220px;height:220px;image-rendering:pixelated;shape-rendering:crispEdges}
#petSvg.thin1{transform:scale(.94,1)}
#petSvg.thin2{transform:scale(.89,.98)}
#petSvg.thin3{transform:scale(.83,.96)}
#petSvg.normal{transform:scale(1)}
#petSvg.chubby1{transform:scale(1.06,1.02)}
#petSvg.chubby2{transform:scale(1.11,1.05)}
#petSvg.chubby3{transform:scale(1.18,1.08)}
.mouth-target{position:absolute;left:50%;top:49%;width:64px;height:54px;transform:translate(-50%,-50%);border-radius:999px}
.mouth-target.active{outline:2px dashed #c9c9bf;outline-offset:4px}
.petname{font-size:17px;font-weight:800;text-align:center;margin-top:6px}
.subrow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.badge{padding:7px 10px;border-radius:999px;background:var(--chip);font-size:12px;color:var(--sub)}
.food-panel{margin-top:14px;background:var(--panel);border-radius:22px;padding:12px}
.food-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.food-head h2{margin:0;font-size:15px}
.food-head small{color:var(--sub)}
.tray{display:flex;gap:10px;overflow:auto;padding:2px 0 4px;min-height:66px}
.tray::-webkit-scrollbar{display:none}
.food-item{flex:0 0 58px;width:58px;height:58px;border:1px solid var(--line);background:#fff;border-radius:16px;display:grid;place-items:center;padding:6px;touch-action:none}
.food-item svg{width:44px;height:44px;image-rendering:pixelated;shape-rendering:crispEdges;display:block}
.empty{color:var(--sub);font-size:13px;padding:10px 4px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px}
.btn{border:0;border-radius:18px;padding:14px 12px;background:#f6f6f3;color:#262626;font-weight:700}
.btn.primary{background:#f3e8a8}
.btn.soft{background:#eff6ee}
.btn svg{width:18px;height:18px;vertical-align:-4px;margin-right:6px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.card{background:var(--panel);border-radius:20px;padding:14px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--sub);font-weight:700}
.value{font-size:24px;font-weight:800;line-height:1.1}
.targetset{margin-top:4px;font-size:12px;color:var(--sub);line-height:1.7}
.row{display:flex;gap:10px}.row>*{flex:1}
.section{margin-top:20px}
.section h2{font-size:16px;margin:0 0 12px}
.list{display:grid;gap:10px}
.entry{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--panel);border-radius:16px}
.entry small{display:block;color:var(--sub)}
.logicon{display:grid;place-items:center;width:34px;height:34px;background:#fff;border-radius:12px;flex:0 0 34px}
.logicon svg{width:24px;height:24px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.bottomnav .inner{width:min(460px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.navbtn{background:none;border:0;padding:8px 0;color:var(--sub);font-size:11px;font-weight:700}
.navbtn.active{color:var(--text)}
.navbtn svg{width:20px;height:20px;display:block;margin:0 auto 4px}
.page{display:none}.page.active{display:block}
.overlay{position:fixed;inset:0;background:rgba(20,20,20,.18);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.open{display:flex}
.sheet{width:min(460px,100%);background:#fff;border-radius:28px 28px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sheethead h3{margin:0;font-size:17px}
.close{background:#f3f3ef;border:0;border-radius:12px;padding:10px 12px;font-weight:700}
.cal-input{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 10px}
.cal-input input{width:180px;font-size:38px;font-weight:800;text-align:right;border-radius:18px;background:#fafaf8}
.preview{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;background:#fafaf8;border-radius:18px;padding:12px;min-height:76px}
.preview svg{width:48px;height:48px;image-rendering:pixelated;shape-rendering:crispEdges}
.small{font-size:12px;color:var(--sub);line-height:1.7}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.choice{background:#fafaf8;border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;font-size:12px;font-weight:700;color:var(--sub)}
.choice.active{background:#eff6ee;color:#24572d;border-color:#cfe3cd}
.choice svg{width:24px;height:24px;display:block;margin:0 auto 6px}
.submit{width:100%;border:0;border-radius:18px;background:#232323;color:#fff;padding:15px 14px;font-weight:800;margin-top:14px}
.note{margin-top:10px;padding:12px 14px;background:#fafaf8;border-radius:16px;font-size:12px;color:var(--sub);line-height:1.7}
.fields{display:grid;gap:12px}
.themegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.theme{background:#fafaf8;border-radius:18px;padding:12px;min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.theme strong{display:block;font-size:13px}.theme small{display:block;color:var(--sub)}
.lock{font-size:11px;color:#8a8a84;background:#fff;border-radius:999px;padding:6px 8px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#232323;color:#fff;padding:11px 14px;border-radius:999px;font-size:13px;display:none;z-index:60}.toast.show{display:block}
.hidden{display:none !important}
@media (max-width:370px){.actions{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr}.row{display:block}.row>*+*{margin-top:12px}}
</style>
</head>
<body>
<div class="app">
  <div id="homePage" class="page active">
    <div class="topbar">
      <div class="title">mogu room</div>
      <div class="modechip" id="modeChip">未設定</div>
    </div>

    <section class="hero">
      <div class="speech" id="speech">今日のカロリーを記録して、エサを食べさせよう。</div>
      <div class="stage" id="stage">
        <div class="character-wrap">
          <div class="mouth-target" id="mouthTarget"></div>
          <div id="petHolder"></div>
        </div>
      </div>
      <div class="petname" id="petLabel">ケーキいぬ</div>
      <div class="subrow">
        <div class="badge" id="bodyStateLabel">ふつう</div>
        <div class="badge" id="bgLabel">背景: ホワイト</div>
      </div>
    </section>

    <section class="food-panel">
      <div class="food-head"><h2>エサ</h2><small id="foodCount">0個</small></div>
      <div class="tray" id="tray"></div>
    </section>

    <div class="actions">
      <button class="btn primary" id="openFoodBtn">ごはん</button>
      <button class="btn soft" id="openExerciseBtn">運動</button>
      <button class="btn" id="openWeightBtn">記録</button>
    </div>

    <div class="summary">
      <div class="card">
        <h3>今日のカロリー</h3>
        <div class="value"><span id="todayCalories">0</span><span style="font-size:14px;font-weight:700;color:var(--sub)"> kcal</span></div>
        <div class="targetset" id="targetSummary">プロフィールを設定すると目標が出るよ。</div>
      </div>
      <div class="card">
        <h3>今日の運動</h3>
        <div class="value"><span id="todayExercise">0</span><span style="font-size:14px;font-weight:700;color:var(--sub)"> kcal</span></div>
        <div class="targetset" id="exerciseCaption">運動で消費したカロリーの目安。</div>
      </div>
    </div>
  </div>

  <div id="logsPage" class="page">
    <div class="topbar"><div class="title">記録</div></div>
    <section class="section">
      <h2>今日のログ</h2>
      <div class="list" id="logsList"></div>
    </section>
    <section class="section">
      <h2>体重の推移</h2>
      <div class="card" id="weightsCard"></div>
    </section>
  </div>

  <div id="settingsPage" class="page">
    <div class="topbar"><div class="title">設定</div></div>
    <section class="section">
      <h2>プロフィール</h2>
      <div class="card">
        <div class="fields">
          <div class="row">
            <div><small class="small">身長 (cm)</small><input id="heightInput" type="number" min="120" max="220" step="0.1"></div>
            <div><small class="small">体重 (kg)</small><input id="weightInput" type="number" min="20" max="300" step="0.1"></div>
          </div>
          <div class="row">
            <div><small class="small">年齢</small><input id="ageInput" type="number" min="10" max="100"></div>
            <div><small class="small">性別</small><select id="sexInput"><option value="female">女性</option><option value="male">男性</option></select></div>
          </div>
          <div><small class="small">1日の運動量</small><select id="activityInput">
            <option value="1.2">かなり少ない</option>
            <option value="1.375">少なめ</option>
            <option value="1.55">ふつう</option>
            <option value="1.725">多め</option>
          </select></div>
          <button class="submit" id="saveProfileBtn" type="button">目標カロリーを計算する</button>
        </div>
      </div>
    </section>
    <section class="section">
      <h2>キャラクター</h2>
      <div class="themegrid" id="petGrid"></div>
    </section>
    <section class="section">
      <h2>背景</h2>
      <div class="themegrid">
        <div class="theme"><div><strong>ホワイト</strong><small>無料</small></div></div>
        <div class="theme"><div><strong>パステルルーム</strong><small>設定画面から変更</small></div><div class="lock">課金</div></div>
        <div class="theme"><div><strong>ナイト</strong><small>設定画面から変更</small></div><div class="lock">課金</div></div>
        <div class="theme"><div><strong>ガーデン</strong><small>設定画面から変更</small></div><div class="lock">課金</div></div>
      </div>
    </section>
  </div>
</div>

<div class="bottomnav">
  <div class="inner">
    <button class="navbtn active" data-page="homePage">ホーム</button>
    <button class="navbtn" data-page="logsPage">記録</button>
    <button class="navbtn" data-page="settingsPage">設定</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheethead"><h3 id="sheetTitle">入力</h3><button class="close" id="closeSheet">閉じる</button></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY='mogu-room-revised-proto-v1';
const pets=[
  {name:'ケーキいぬ', face:'gentle'},
  {name:'おにぎりうさ', face:'sleepy'},
  {name:'プリンひよこ', face:'cheer'},
  {name:'メロンくま', face:'cool'},
  {name:'だんごねこ', face:'mischief'}
];
const foodCatalog=[
  ['rice',200],['ramen',700],['bread',160],['apple',100],['salad',80],['cake',350],['egg',75],['milk',130],
  ['soup',120],['sandwich',300],['curry',650],['pasta',550],['fish',180],['chicken',250],['yogurt',110],['cookie',50],
  ['stew',420],['dumpling',280],['strawberry',35],['donut',230],['nuts',60],['bento',500],['bite',20]
];
const foodNames={rice:'おにぎり',ramen:'ラーメン',bread:'トースト',apple:'りんご',salad:'サラダ',cake:'ケーキ',egg:'たまご',milk:'ミルク',soup:'スープ',sandwich:'サンドイッチ',curry:'カレー',pasta:'パスタ',fish:'焼き魚',chicken:'チキン',yogurt:'ヨーグルト',cookie:'クッキー',stew:'シチュー',dumpling:'ぎょうざ',strawberry:'いちご',donut:'ドーナツ',nuts:'ナッツ',bento:'おべんとう',bite:'ひとくち'};
const exerciseKinds={walk:{label:'ウォーキング', icon:'walk', burnPerMin:3.5}, strength:{label:'筋トレ', icon:'strength', burnPerMin:5.5}, swim:{label:'水泳', icon:'swim', burnPerMin:7.5}, dance:{label:'ダンス', icon:'dance', burnPerMin:5}, yoga:{label:'ヨガ', icon:'yoga', burnPerMin:2.5}};
const state=load();
let drag=null;

function load(){
  try{
    return Object.assign({
      petIndex:0,bg:'white',
      profile:{height:'',weight:'',age:'',sex:'female',activity:'1.375'},
      targets:null,
      meals:[], exercises:[], weights:[],
      foodPieces:[]
    }, JSON.parse(localStorage.getItem(KEY)||'{}'))
  }catch{ return {petIndex:0,bg:'white',profile:{height:'',weight:'',age:'',sex:'female',activity:'1.375'},targets:null,meals:[],exercises:[],weights:[],foodPieces:[]} }
}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function today(){return new Date().toISOString().slice(0,10)}
function q(s){return document.querySelector(s)}
function qa(s){return [...document.querySelectorAll(s)]}
function toast(msg){const t=q('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._);toast._=setTimeout(()=>t.classList.remove('show'),2200)}
function openSheet(title,html){q('#sheetTitle').textContent=title;q('#sheetBody').innerHTML=html;q('#overlay').classList.add('open')}
function closeSheet(){q('#overlay').classList.remove('open')}

function icon(name){
  const map={
    walk:'<path d="M14 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/><path d="m8 20 3-5 2-2 3 3 2 4M3 12l5-4 4 3 4 1 5-2M12 11l-2 5"/>',
    strength:'<path d="M2 10h3v4H2zM19 10h3v4h-3zM5 11h14"/><path d="M8 9v6M16 9v6"/>',
    swim:'<path d="M2 15c2 0 2 2 4 2s2-2 4-2 2 2 4 2 2-2 4-2 2 2 4 2"/><circle cx="14" cy="8" r="2"/><path d="m10 12 4-2 5 1"/>',
    dance:'<circle cx="12" cy="4" r="2"/><path d="M8 21l2-5 2-2 2 2 2 5M6 12l4-3 2 2 2-2 4 3"/>',
    yoga:'<circle cx="12" cy="5" r="2"/><path d="M7 11c1 3 3 4 5 4s4-1 5-4M6 21c2-3 4-4 6-4s4 1 6 4"/>'
  };
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${map[name]||''}</svg>`
}

function foodSvg(kind){
  const svgs={
    rice:`<svg viewBox="0 0 24 24"><rect x="7" y="10" width="10" height="8" fill="#262626"/><path d="M5 10 12 4l7 6v8H5Z" fill="#fff8eb" stroke="#262626" stroke-width="1"/></svg>`,
    ramen:`<svg viewBox="0 0 24 24"><path d="M4 11h16l-2 7H6Z" fill="#d8b6a4" stroke="#262626" stroke-width="1"/><path d="M6 10c2-2 4 0 6-1s3-1 6 1" fill="none" stroke="#eacb69" stroke-width="2"/><path d="M7 4l9-2" stroke="#262626" stroke-width="1.2"/><path d="M9 7 18 5" stroke="#262626" stroke-width="1.2"/></svg>`,
    bread:`<svg viewBox="0 0 24 24"><path d="M6 18V9c0-2 2-3 4-2 1-1 3-1 4 0 2-1 4 0 4 2v9Z" fill="#dbad79" stroke="#262626" stroke-width="1"/><path d="M8 16V9c1-1 2-1 3 0 1-1 2-1 3 0 1-1 2-1 3 0v7Z" fill="#fff0c5"/></svg>`,
    apple:`<svg viewBox="0 0 24 24"><path d="M12 7c-4-2-7 1-6 5 1 5 4 7 6 7s5-2 6-7c1-4-2-7-6-5Z" fill="#da9894" stroke="#262626" stroke-width="1"/><path d="M12 7c0-2 1-3 2-4" stroke="#262626" stroke-width="1.2"/><path d="M13 4c2-1 4 0 4 1-2 1-3 1-4-1Z" fill="#86b67f" stroke="#262626" stroke-width="1"/></svg>`,
    salad:`<svg viewBox="0 0 24 24"><path d="M4 12h16l-2 6H6Z" fill="#f5e8d2" stroke="#262626" stroke-width="1"/><circle cx="8" cy="10" r="3" fill="#80b77e"/><circle cx="13" cy="9" r="3.2" fill="#9bc589"/><circle cx="17" cy="10" r="2.8" fill="#76ae74"/></svg>`,
    cake:`<svg viewBox="0 0 24 24"><path d="M5 11h14v8H5Z" fill="#efc2b4" stroke="#262626" stroke-width="1"/><path d="M5 13h14" stroke="#fff7e8" stroke-width="2"/><path d="M5 11c1-3 3-2 4-1 1-2 3-2 4-1 2-2 4-1 6 1" fill="#fff8ef" stroke="#262626" stroke-width="1"/><rect x="11" y="5" width="2" height="4" fill="#d88989"/></svg>`,
    egg:`<svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="6" ry="8" fill="#fff8eb" stroke="#262626" stroke-width="1"/><circle cx="12" cy="13" r="3" fill="#efc56b"/></svg>`,
    milk:`<svg viewBox="0 0 24 24"><path d="M8 5h8l1 3v11H7V8Z" fill="#f8f8f0" stroke="#262626" stroke-width="1"/><path d="M7 13h10" stroke="#9fc8c7" stroke-width="2"/></svg>`,
    soup:`<svg viewBox="0 0 24 24"><path d="M4 12h16l-2 6H6Z" fill="#bccfc0" stroke="#262626" stroke-width="1"/><path d="M6 11h12" stroke="#efcf95" stroke-width="2"/><path d="M9 6c-1 1-1 2 0 3M13 5c-1 1-1 2 0 3" stroke="#262626" stroke-width="1.2"/></svg>`,
    sandwich:`<svg viewBox="0 0 24 24"><path d="M4 9h16L12 18Z" fill="#dcad7c" stroke="#262626" stroke-width="1"/><path d="M6 10h12l-6 6Z" fill="#98bf8f"/></svg>`,
    curry:`<svg viewBox="0 0 24 24"><path d="M4 12h16l-2 6H6Z" fill="#faf4e2" stroke="#262626" stroke-width="1"/><path d="M5 12c2-4 6-3 8-2 3-1 5 0 6 2" fill="#b58a66"/></svg>`,
    pasta:`<svg viewBox="0 0 24 24"><ellipse cx="12" cy="15" rx="8" ry="4" fill="#f6f0e4" stroke="#262626" stroke-width="1"/><path d="M6 14c2-3 4 1 6-1s3-2 6 1" fill="none" stroke="#e1c36e" stroke-width="2"/></svg>`,
    fish:`<svg viewBox="0 0 24 24"><path d="M4 12c3-5 8-4 11-1l5-3v8l-5-3c-3 3-8 4-11-1Z" fill="#aec8c1" stroke="#262626" stroke-width="1"/><circle cx="8" cy="11" r="1" fill="#262626"/></svg>`,
    chicken:`<svg viewBox="0 0 24 24"><path d="M7 13c-1-4 2-6 5-5 4-1 6 2 5 5-1 4-4 5-7 5-2 0-3-2-3-5Z" fill="#d3a27b" stroke="#262626" stroke-width="1"/><path d="M16 16l3 3" stroke="#fff7e9" stroke-width="2"/></svg>`,
    yogurt:`<svg viewBox="0 0 24 24"><path d="M7 8h10l-1 10H8Z" fill="#fbf9ef" stroke="#262626" stroke-width="1"/><path d="M6 8h12" stroke="#9ec8bf" stroke-width="2"/><circle cx="12" cy="14" r="2" fill="#dc9aa6"/></svg>`,
    cookie:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="#e0b67f" stroke="#262626" stroke-width="1"/><circle cx="9" cy="10" r="1" fill="#9a7b61"/><circle cx="14" cy="12" r="1" fill="#9a7b61"/><circle cx="12" cy="15" r="1" fill="#9a7b61"/></svg>`,
    stew:`<svg viewBox="0 0 24 24"><path d="M4 12h16l-2 6H6Z" fill="#c6aaa5" stroke="#262626" stroke-width="1"/><circle cx="9" cy="12" r="2" fill="#dcb38d"/><circle cx="14" cy="12" r="2" fill="#9fbd90"/></svg>`,
    dumpling:`<svg viewBox="0 0 24 24"><path d="M5 15c2-5 6-5 7-5 4 0 6 2 7 5-4 3-10 3-14 0Z" fill="#f0deb1" stroke="#262626" stroke-width="1"/><path d="M9 12l1 2M12 11l1 3M15 12l1 2" stroke="#cfbb93" stroke-width="1"/></svg>`,
    strawberry:`<svg viewBox="0 0 24 24"><path d="M12 8c-4-1-6 2-5 5 1 4 3 5 5 5s4-2 5-5c1-3-1-6-5-5Z" fill="#dd9390" stroke="#262626" stroke-width="1"/><path d="M8 8 12 6l1 2 3-2 1 2" fill="#89b584" stroke="#262626" stroke-width="1"/></svg>`,
    donut:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="#e6ba88" stroke="#262626" stroke-width="1"/><circle cx="12" cy="12" r="3" fill="#fffaf0"/><path d="M6 10c2-4 8-4 12 0" stroke="#e2a4b0" stroke-width="2"/></svg>`,
    nuts:`<svg viewBox="0 0 24 24"><ellipse cx="9" cy="13" rx="3" ry="5" fill="#d1a07d" stroke="#262626" stroke-width="1"/><ellipse cx="15" cy="11" rx="3" ry="5" fill="#e4be95" stroke="#262626" stroke-width="1"/></svg>`,
    bento:`<svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1" fill="#a8907d" stroke="#262626" stroke-width="1"/><path d="M12 6v12M4 12h16" stroke="#f0e4c7" stroke-width="1"/><circle cx="8" cy="9" r="2" fill="#faf5e1"/><circle cx="16" cy="9" r="2" fill="#dbab89"/><circle cx="8" cy="15" r="2" fill="#94b58a"/><circle cx="16" cy="15" r="2" fill="#f0cf84"/></svg>`,
    bite:`<svg viewBox="0 0 24 24"><ellipse cx="12" cy="13" rx="6" ry="5" fill="#f1deb6" stroke="#262626" stroke-width="1"/><circle cx="12" cy="13" r="2" fill="#deaf97"/></svg>`
  };
  return svgs[kind]||svgs.bite;
}

function chooseFoods(cal){
  cal=Math.round(Number(cal)); if(!(cal>0)) return [];
  if(cal===200) return ['rice']; if(cal===700) return ['ramen']; if(cal===900) return ['rice','ramen']; if(cal<35) return ['bite'];
  let best={score:Infinity,items:['rice']};
  function consider(items,sum){
    const diff=Math.abs(sum-cal), dup=items.length-new Set(items).size;
    const score=diff*1.7+items.length*12+dup*26;
    if(score<best.score) best={score,items:[...items]};
  }
  for(let i=0;i<foodCatalog.length;i++){
    const [aKey,aCal]=foodCatalog[i]; consider([aKey],aCal);
    for(let j=i;j<foodCatalog.length;j++){
      const [bKey,bCal]=foodCatalog[j]; const ab=aCal+bCal; if(ab>cal+140) continue; consider([aKey,bKey],ab);
      for(let k=j;k<foodCatalog.length;k++){
        const [cKey,cCal]=foodCatalog[k]; const abc=ab+cCal; if(abc>cal+100) continue; consider([aKey,bKey,cKey],abc);
      }
    }
  }
  return best.items;
}

function calcTargets(profile){
  const h=Number(profile.height), w=Number(profile.weight), age=Number(profile.age), act=Number(profile.activity);
  if(!(h>0&&w>0&&age>0&&act>0)) return null;
  const bmr = profile.sex==='male' ? 10*w + 6.25*h - 5*age + 5 : 10*w + 6.25*h - 5*age - 161;
  const tdee = Math.round(bmr*act);
  return {
    maintain:[Math.round(tdee-100), Math.round(tdee+100)],
    lose:[Math.round(tdee-500), Math.round(tdee-200)],
    gain:[Math.round(tdee+150), Math.round(tdee+450)],
    tdee
  };
}

function bodyState(){
  const cal=todayCalories(); const t=state.targets; if(!t) return {key:'normal', label:'ふつう'};
  const [l0,l1]=t.lose, [m0,m1]=t.maintain, [g0,g1]=t.gain;
  if(cal>=m0 && cal<=m1) return {key:'normal',label:'ふつう'};
  if(cal>=l0 && cal<=l1){ const p=(cal-l0)/(l1-l0||1); return p<.34?{key:'thin3',label:'かなりスリム'}:p<.67?{key:'thin2',label:'スリム'}:{key:'thin1',label:'ややスリム'} }
  if(cal>=g0 && cal<=g1){ const p=(cal-g0)/(g1-g0||1); return p<.34?{key:'chubby1',label:'ややふっくら'}:p<.67?{key:'chubby2',label:'ふっくら'}:{key:'chubby3',label:'かなりふっくら'} }
  if(cal<l0) return {key:'thin3',label:'かなりスリム'};
  if(cal>g1) return {key:'chubby3',label:'かなりふっくら'};
  return cal<m0 ? {key:'thin1',label:'ややスリム'} : {key:'chubby1',label:'ややふっくら'};
}

function petSvg(index,stateKey){
  const spec=pets[index];
  const palettes=[
    {line:'#252823',main:'#f0c9b5',sub:'#fff5df',cheek:'#d79692'},
    {line:'#252823',main:'#fff8e8',sub:'#84a985',cheek:'#dfaba7'},
    {line:'#252823',main:'#f2d37f',sub:'#d0a06d',cheek:'#dfaa9c'},
    {line:'#252823',main:'#b9d38f',sub:'#7da17f',cheek:'#e4b19e'},
    {line:'#252823',main:'#dfb5c6',sub:'#f1ddc6',cheek:'#aa8fb0'}
  ][index];
  const {line,main,sub,cheek}=palettes;
  const bodyClass=stateKey;

  function face(type){
    if(type==='gentle') return `
      <rect x="8" y="10" width="2" height="2" fill="${line}"/><rect x="14" y="10" width="2" height="2" fill="${line}"/>
      <rect x="10" y="14" width="4" height="1" fill="${line}"/><rect x="5" y="13" width="2" height="1" fill="${cheek}"/><rect x="17" y="13" width="2" height="1" fill="${cheek}"/>`;
    if(type==='sleepy') return `
      <rect x="7" y="10" width="3" height="1" fill="${line}"/><rect x="14" y="10" width="3" height="1" fill="${line}"/>
      <rect x="10" y="14" width="4" height="2" fill="${line}"/><rect x="11" y="15" width="2" height="1" fill="${sub}"/>`;
    if(type==='cheer') return `
      <rect x="8" y="10" width="2" height="2" fill="${line}"/><rect x="14" y="10" width="2" height="2" fill="${line}"/>
      <rect x="9" y="14" width="6" height="2" fill="${line}"/><rect x="10" y="13" width="4" height="1" fill="${line}"/><rect x="5" y="13" width="2" height="1" fill="${cheek}"/><rect x="17" y="13" width="2" height="1" fill="${cheek}"/>`;
    if(type==='cool') return `
      <rect x="7" y="10" width="4" height="2" fill="${line}"/><rect x="13" y="10" width="4" height="2" fill="${line}"/>
      <rect x="10" y="14" width="4" height="1" fill="${line}"/>`;
    return `
      <rect x="8" y="10" width="2" height="2" fill="${line}"/><rect x="14" y="10" width="2" height="2" fill="${line}"/>
      <rect x="9" y="14" width="6" height="1" fill="${line}"/><rect x="11" y="15" width="2" height="1" fill="${line}"/><rect x="5" y="13" width="2" height="1" fill="${cheek}"/><rect x="17" y="13" width="2" height="1" fill="${cheek}"/>`;
  }

  const shapes=[
    // cake inu
    `<rect x="5" y="9" width="4" height="6" fill="${main}"/><rect x="15" y="9" width="4" height="6" fill="${main}"/><rect x="4" y="13" width="16" height="8" fill="${main}"/><rect x="6" y="7" width="12" height="4" fill="${sub}"/><rect x="7" y="17" width="10" height="1" fill="${sub}"/>`,
    // onigiri usa rounded
    `<rect x="7" y="4" width="3" height="8" fill="${main}"/><rect x="14" y="4" width="3" height="8" fill="${main}"/><rect x="5" y="10" width="14" height="10" fill="${main}"/><rect x="8" y="16" width="8" height="3" fill="${sub}"/>`,
    // pudding hiyoko
    `<rect x="7" y="7" width="10" height="3" fill="${sub}"/><rect x="5" y="9" width="14" height="10" fill="${main}"/><rect x="10" y="5" width="4" height="2" fill="${main}"/><rect x="6" y="18" width="4" height="2" fill="${sub}"/><rect x="14" y="18" width="4" height="2" fill="${sub}"/>`,
    // melon kuma
    `<rect x="4" y="8" width="5" height="5" fill="${main}"/><rect x="15" y="8" width="5" height="5" fill="${main}"/><rect x="5" y="10" width="14" height="10" fill="${main}"/><rect x="7" y="12" width="10" height="1" fill="${sub}"/><rect x="7" y="15" width="10" height="1" fill="${sub}"/>`,
    // dango neko
    `<rect x="6" y="6" width="4" height="6" fill="${main}"/><rect x="14" y="6" width="4" height="6" fill="${main}"/><rect x="5" y="10" width="14" height="9" fill="${main}"/><rect x="7" y="8" width="10" height="3" fill="${sub}"/><rect x="7" y="18" width="10" height="2" fill="${sub}"/>`
  ][index];

  const outline=`<rect x="0" y="0" width="24" height="24" fill="transparent"/>`;
  return `<svg id="petSvg" class="${bodyClass}" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">${outline}${shapes}${face(spec.face)}</svg>`;
}

function renderPet(){
  const body=bodyState();
  q('#petHolder').innerHTML=petSvg(state.petIndex, body.key);
  q('#petLabel').textContent=pets[state.petIndex].name;
  q('#bodyStateLabel').textContent=body.label;
}

function renderPetGrid(){
  q('#petGrid').innerHTML=pets.map((p,i)=>`<button class="theme" data-pet="${i}"><div>${petSvg(i,'normal')}</div><div><strong>${p.name}</strong><small>${['やさしい顔','ねむそうな顔','元気な顔','クールな顔','いたずら顔'][i]}</small></div></button>`).join('');
  q('#petGrid').querySelectorAll('[data-pet]').forEach(btn=>btn.addEventListener('click',()=>{state.petIndex=Number(btn.dataset.pet);save();renderAll();toast('キャラを変更したよ。')}));
  q('#petGrid').querySelectorAll('svg').forEach(svg=>{svg.style.width='52px';svg.style.height='52px'});
}

function todayMeals(){return state.meals.filter(x=>x.date===today())}
function todayExercises(){return state.exercises.filter(x=>x.date===today())}
function todayCalories(){return todayMeals().reduce((a,b)=>a+b.cal,0)}
function todayExerciseBurn(){return Math.round(todayExercises().reduce((a,b)=>a+b.burn,0))}
function renderSummary(){
  q('#todayCalories').textContent=todayCalories();
  q('#todayExercise').textContent=todayExerciseBurn();
  if(state.targets){
    const t=state.targets;
    q('#targetSummary').innerHTML=`減量 ${t.lose[0]}–${t.lose[1]} kcal<br>維持 ${t.maintain[0]}–${t.maintain[1]} kcal<br>増量 ${t.gain[0]}–${t.gain[1]} kcal`;
    const body=bodyState();
    q('#modeChip').textContent=body.label;
  }else{
    q('#targetSummary').textContent='プロフィールを設定すると目標が出るよ。';
    q('#modeChip').textContent='未設定';
  }
}

function renderTray(){
  const tray=q('#tray');
  if(!state.foodPieces.length){
    tray.innerHTML='<div class="empty">ごはんを記録するとエサが出るよ。</div>';
    q('#foodCount').textContent='0個';
    return;
  }
  tray.innerHTML=state.foodPieces.map((p,idx)=>`<button class="food-item" data-food-index="${idx}" aria-label="${foodNames[p.kind]||'エサ'}">${foodSvg(p.kind)}</button>`).join('');
  q('#foodCount').textContent=`${state.foodPieces.length}個`;
  qa('.food-item').forEach(btn=>setupFoodDrag(btn));
}

function setupFoodDrag(btn){
  btn.addEventListener('pointerdown',e=>{
    const idx=Number(btn.dataset.foodIndex);
    drag={idx, ghost:document.createElement('div')};
    drag.ghost.className='food-item';
    drag.ghost.style.position='fixed'; drag.ghost.style.zIndex='55'; drag.ghost.style.pointerEvents='none';
    drag.ghost.style.left=e.clientX-29+'px'; drag.ghost.style.top=e.clientY-29+'px';
    drag.ghost.innerHTML=state.foodPieces[idx] ? foodSvg(state.foodPieces[idx].kind) : '';
    document.body.appendChild(drag.ghost);
    q('#mouthTarget').classList.add('active');
    btn.setPointerCapture(e.pointerId);
  });
  btn.addEventListener('pointermove',e=>{
    if(!drag) return;
    drag.ghost.style.left=e.clientX-29+'px'; drag.ghost.style.top=e.clientY-29+'px';
  });
  btn.addEventListener('pointerup',e=>finishDrag(e.clientX,e.clientY));
  btn.addEventListener('pointercancel',()=>cancelDrag());
}
function finishDrag(x,y){
  if(!drag) return;
  const mouth=q('#mouthTarget').getBoundingClientRect();
  const inside=x>=mouth.left && x<=mouth.right && y>=mouth.top && y<=mouth.bottom;
  if(inside){
    state.foodPieces.splice(drag.idx,1); save(); renderTray();
    q('#speech').textContent='もぐもぐ。おいしい！'; renderPet(); toast('エサを食べたよ');
  }
  cancelDrag();
}
function cancelDrag(){
  q('#mouthTarget').classList.remove('active');
  if(drag?.ghost) drag.ghost.remove();
  drag=null;
}

function renderLogs(){
  const items=[];
  todayMeals().forEach(m=>items.push({type:'meal', text:`${m.cal} kcal`, sub:'ごはん'}));
  todayExercises().forEach(x=>items.push({type:'exercise', text:`${x.label} ${x.min}分`, sub:`約 ${x.burn} kcal 消費`}));
  q('#logsList').innerHTML=items.length?items.map(x=>`<div class="entry"><div style="display:flex;align-items:center;gap:10px"><div class="logicon">${x.type==='meal'?foodSvg('rice'):icon('walk')}</div><div><strong>${x.text}</strong><small>${x.sub}</small></div></div></div>`).join(''):'<div class="card"><div class="small">まだ今日の記録がないよ。</div></div>';
  const latest=[...state.weights].sort((a,b)=>b.date.localeCompare(a.date));
  q('#weightsCard').innerHTML=latest.length?latest.slice(0,8).map(w=>`<div class="entry"><div><strong>${w.weight} kg</strong><small>${w.date}</small></div></div>`).join(''):'<div class="small">体重記録はまだないよ。</div>';
}

function openFoodSheet(){
  openSheet('ごはん', `
    <div class="cal-input"><input id="mealCalInput" type="number" min="1" max="10000" value="200"><span>kcal</span></div>
    <div class="preview" id="foodPreview"></div>
    <div class="note">カロリーに近い一般的な食品の組み合わせを、自動でエサとして作るよ。エサにはカロリー表示は出ないよ。</div>
    <button class="submit" id="saveMealBtn">エサをつくる</button>
  `);
  const input=q('#mealCalInput');
  const draw=()=>q('#foodPreview').innerHTML=chooseFoods(Number(input.value)).map(foodSvg).join('')||'<div class="small">カロリーを入力してね。</div>';
  draw(); input.addEventListener('input',draw);
  q('#saveMealBtn').addEventListener('click',()=>{
    const cal=Math.round(Number(input.value)); if(!(cal>0)) return;
    const foods=chooseFoods(cal);
    state.meals.push({date:today(), cal});
    foods.forEach(kind=>state.foodPieces.push({kind, createdAt:Date.now()+Math.random()}));
    save(); closeSheet(); renderAll(); q('#speech').textContent='エサができたよ。口まで運んでね。'; toast('エサを追加したよ');
  });
}

function openExerciseSheet(){
  openSheet('運動', `
    <div class="choices" id="exerciseChoices">${Object.entries(exerciseKinds).map(([k,v],i)=>`<button class="choice ${i===0?'active':''}" data-kind="${k}">${icon(v.icon)}${v.label}</button>`).join('')}</div>
    <div class="cal-input"><input id="exerciseMinInput" type="number" min="1" max="600" value="30"><span>分</span></div>
    <button class="submit" id="saveExerciseBtn">運動を記録</button>
  `);
  let selected='walk';
  qa('[data-kind]').forEach(btn=>btn.addEventListener('click',()=>{selected=btn.dataset.kind; qa('[data-kind]').forEach(x=>x.classList.remove('active')); btn.classList.add('active');}));
  q('#saveExerciseBtn').addEventListener('click',()=>{
    const min=Math.round(Number(q('#exerciseMinInput').value)); if(!(min>0)) return;
    const kind=exerciseKinds[selected];
    state.exercises.push({date:today(), kind:selected, label:kind.label, min, burn:Math.round(min*kind.burnPerMin)});
    save(); closeSheet(); renderAll(); q('#speech').textContent=`${kind.label}したよ。えらい！`; toast('運動を記録したよ');
  });
}

function openWeightSheet(){
  openSheet('体重を記録', `
    <div class="fields">
      <div><small class="small">日付</small><input id="weightDateInput" type="date" value="${today()}"></div>
      <div><small class="small">体重 (kg)</small><input id="weightValueInput" type="number" min="20" max="300" step="0.1"></div>
      <button class="submit" id="saveWeightBtn">保存</button>
    </div>
  `);
  q('#saveWeightBtn').addEventListener('click',()=>{
    const date=q('#weightDateInput').value; const weight=Number(q('#weightValueInput').value); if(!date||!(weight>0)) return;
    state.weights=state.weights.filter(x=>x.date!==date); state.weights.push({date, weight}); state.profile.weight=String(weight); save(); closeSheet(); renderAll(); toast('体重を記録したよ');
  });
}

function bindSettings(){
  q('#heightInput').value=state.profile.height; q('#weightInput').value=state.profile.weight; q('#ageInput').value=state.profile.age; q('#sexInput').value=state.profile.sex; q('#activityInput').value=state.profile.activity;
  q('#saveProfileBtn').onclick=()=>{
    state.profile={height:q('#heightInput').value, weight:q('#weightInput').value, age:q('#ageInput').value, sex:q('#sexInput').value, activity:q('#activityInput').value};
    state.targets=calcTargets(state.profile); save(); renderAll(); toast('目標カロリーを更新したよ');
  };
}

function switchPage(id){ qa('.page').forEach(p=>p.classList.remove('active')); q('#'+id).classList.add('active'); qa('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.page===id)); if(id==='logsPage') renderLogs(); if(id==='settingsPage'){ bindSettings(); renderPetGrid(); } }
function renderAll(){ renderPet(); renderSummary(); renderTray(); renderLogs(); bindSettings(); renderPetGrid(); q('#bgLabel').textContent='背景: ホワイト'; }

q('#openFoodBtn').addEventListener('click',openFoodSheet);
q('#openExerciseBtn').addEventListener('click',openExerciseSheet);
q('#openWeightBtn').addEventListener('click',openWeightSheet);
q('#closeSheet').addEventListener('click',closeSheet);
q('#overlay').addEventListener('click',e=>{ if(e.target===q('#overlay')) closeSheet(); });
qa('.navbtn').forEach(btn=>btn.addEventListener('click',()=>switchPage(btn.dataset.page)));

if(!state.targets && state.profile.height && state.profile.weight && state.profile.age) state.targets=calcTargets(state.profile);
save(); renderAll();
</script>
