<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>mogu room</title>
<style>
:root{
  --bg:#fbfbf8; --panel:#f3f3ef; --line:#e6e7e1; --text:#39433c; --sub:#7c857e;
  --green:#8fbd8c; --yellow:#d7c56f; --red:#d99683; --track:#d8dbd6; --accent:#9eb69f;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif}
body{min-height:100dvh}
button,input,select{font:inherit}
button{border:0;background:none;color:inherit}
.hidden{display:none!important}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:12px 16px calc(86px + env(safe-area-inset-bottom))}
.page{display:none;flex:1;min-height:0}.page.active{display:flex;flex-direction:column}
.home-page{display:grid;grid-template-rows:auto 1fr auto;gap:8px;min-height:calc(100dvh - 120px)}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:4px}
.topbar h1{margin:0;font-size:18px;line-height:1.2;font-weight:800}
.topbar .kcal-row{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.kcal{font-size:17px;font-weight:800;white-space:nowrap}
.soft-btn{padding:10px 14px;border-radius:14px;background:var(--panel);font-weight:700;color:#70776f}
.gauge-wrap{margin-top:4px}
.gauge{position:relative;height:20px;border-radius:999px;background:var(--track);overflow:hidden}
.gauge-fill{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,var(--green) 0 40%,var(--yellow) 40% 70%,var(--red) 70% 100%);clip-path:inset(0 100% 0 0);transition:clip-path .25s ease}
.boundary{position:absolute;top:2px;bottom:2px;width:0;border-left:2px dotted rgba(60,68,63,.5)}
.boundary.b1{left:40%}.boundary.b2{left:70%}
.gauge-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);padding:7px 4px 0}
.center-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:0 6px 6px;position:relative}
.speech{max-width:240px;background:var(--panel);padding:10px 14px;border-radius:18px;font-weight:700;color:#6d756e;font-size:15px;position:relative;text-align:center;margin-bottom:10px}
.speech:after{content:"";position:absolute;left:50%;transform:translateX(-50%) rotate(45deg);bottom:-5px;width:10px;height:10px;background:var(--panel)}
.pet-stage{width:100%;display:flex;align-items:center;justify-content:center;flex:1;position:relative;min-height:220px}
#petCanvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;max-width:min(66vw,240px);max-height:320px}
#fxLayer{position:absolute;inset:0;pointer-events:none}
#petName{font-size:18px;font-weight:800;margin:8px 0 0;text-align:center}
.bottom-panel{display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
.food-panel{background:var(--panel);border-radius:22px;padding:12px 14px 16px}
.food-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}
.food-tray{display:flex;gap:10px;min-height:76px;overflow-x:auto;padding-bottom:4px}
.food-item{width:70px;height:70px;border-radius:18px;background:#fff;display:grid;place-items:center;flex:0 0 auto;touch-action:none;box-shadow:inset 0 0 0 1px #ecece7}
.food-item canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.empty{min-height:60px;display:flex;align-items:center;color:var(--sub);font-size:14px}
.action-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.action-btn{background:#e9ecdf;border-radius:18px;padding:16px 10px;text-align:center;font-weight:800;font-size:16px}
.action-btn.secondary{background:#eceeed}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:rgba(251,251,248,.96);backdrop-filter:blur(8px);border-top:1px solid #e8e8e2;padding:10px 20px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:30}
.nav-inner{max-width:480px;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nav-btn{padding:10px 4px;text-align:center;font-size:14px;font-weight:700;color:#8b938c}.nav-btn.active{color:#5e8b65}
.section{background:var(--panel);border-radius:22px;padding:16px;margin-top:10px}
.section h2{margin:0 0 12px;font-size:17px}
.field-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.field{display:flex;flex-direction:column;gap:6px}.field.wide{grid-column:1 / -1}
.field label,.label{font-size:13px;font-weight:700;color:#667067}
.field input,.field select{height:44px;border:1px solid #e3e5df;background:#fff;border-radius:12px;padding:0 12px;font-size:15px;color:var(--text)}
.submit{margin-top:14px;width:100%;height:46px;border-radius:14px;background:#dce7d8;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.list{display:flex;flex-direction:column;gap:10px}.list-item{background:#fff;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--sub);font-size:13px}
.pet-picker{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pet-option{background:#fff;border-radius:16px;padding:10px;display:flex;align-items:center;gap:10px;text-align:left;box-shadow:inset 0 0 0 1px #ecece7}
.pet-option.selected{box-shadow:inset 0 0 0 2px #a7c5a8;background:#f6fbf5}
.pet-option canvas{image-rendering:pixelated;image-rendering:crisp-edges;flex:0 0 auto}
.modal-backdrop{position:fixed;inset:0;background:rgba(30,32,30,.28);display:none;align-items:flex-end;justify-content:center;z-index:40;padding:12px}.modal-backdrop.show{display:flex}
.sheet{width:min(480px,100%);background:var(--bg);border-radius:24px 24px 16px 16px;padding:18px 16px 20px;box-shadow:0 -8px 24px rgba(0,0,0,.08)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sheet-head h3{margin:0;font-size:18px}
.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.choice-btn{background:#fff;border-radius:16px;padding:14px;box-shadow:inset 0 0 0 1px #ecece7;text-align:left}.choice-btn .title{font-weight:800;display:block;margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));background:#3d443f;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}
@media (max-width:370px){.field-grid{grid-template-columns:1fr}.action-row{gap:8px}.action-btn{font-size:15px;padding:14px 8px}}
</style>
</head>
<body>
<div class="app">
  <section class="page home-page active" id="page-home">
    <div>
      <div class="topbar">
        <div>
          <h1 id="topTitle">プロフィールを設定</h1>
        </div>
        <div class="kcal-row">
          <div class="kcal"><span id="netKcal">0</span> kcal</div>
          <button class="soft-btn" id="resetBtn" type="button">リセット</button>
        </div>
      </div>
      <div class="gauge-wrap">
        <div class="gauge" aria-label="今日のカロリーゲージ">
          <div class="gauge-fill" id="gaugeFill"></div>
          <div class="boundary b1"></div>
          <div class="boundary b2"></div>
        </div>
        <div class="gauge-labels"><span>減量</span><span>維持</span><span>増量</span></div>
      </div>
    </div>

    <div class="center-stage">
      <div class="speech" id="speech">タップしておしゃべり</div>
      <div class="pet-stage" id="petStage">
        <canvas id="petCanvas" width="120" height="180" aria-label="ペット"></canvas>
        <canvas id="fxLayer" width="320" height="240"></canvas>
      </div>
      <div id="petName">ラベンダーうさぎ</div>
    </div>

    <div class="bottom-panel">
      <div class="food-panel">
        <div class="food-head"><span>エサ</span><span id="foodCount">0個</span></div>
        <div class="food-tray" id="foodTray"></div>
      </div>
      <div class="action-row">
        <button class="action-btn" id="openFoodBtn" type="button">ごはん</button>
        <button class="action-btn secondary" id="openExerciseBtn" type="button">運動</button>
        <button class="action-btn secondary" id="toLogsBtn" type="button">記録</button>
      </div>
    </div>
  </section>

  <section class="page" id="page-logs">
    <div class="topbar"><h1>記録</h1></div>
    <div class="section"><h2>今日の食事</h2><div class="list" id="mealList"></div></div>
    <div class="section"><h2>今日の運動</h2><div class="list" id="exerciseList"></div></div>
    <div class="section"><h2>体重履歴</h2><div class="list" id="weightList"></div></div>
  </section>

  <section class="page" id="page-settings">
    <div class="topbar"><h1>設定</h1></div>
    <div class="section">
      <h2>プロフィール</h2>
      <div class="field-grid">
        <div class="field"><label for="heightInput">身長 cm</label><input id="heightInput" type="number" step="0.1"></div>
        <div class="field"><label for="weightInput">体重 kg</label><input id="weightInput" type="number" step="0.1"></div>
        <div class="field"><label for="ageInput">年齢</label><input id="ageInput" type="number"></div>
        <div class="field"><label for="sexInput">性別（計算用）</label><select id="sexInput"><option value="female">女性</option><option value="male">男性</option></select></div>
        <div class="field wide"><label for="activityInput">活動量</label><select id="activityInput"><option value="1.2">少ない</option><option value="1.375">軽め</option><option value="1.55">普通</option><option value="1.725">多い</option></select></div>
      </div>
      <button class="submit" id="saveProfileBtn" type="button">目安を更新</button>
      <div class="muted" id="targetText" style="margin-top:10px"></div>
    </div>

    <div class="section">
      <h2>キャラを選ぶ</h2>
      <div class="pet-picker" id="petPicker"></div>
    </div>

    <div class="section">
      <h2>体重を記録</h2>
      <div class="field-grid">
        <div class="field wide"><label for="weightRecordInput">今日の体重 kg</label><input id="weightRecordInput" type="number" step="0.1"></div>
      </div>
      <button class="submit" id="saveWeightBtn" type="button">体重を保存</button>
    </div>
  </section>
</div>

<div class="bottom-nav">
  <div class="nav-inner">
    <button class="nav-btn active" data-page="home">ホーム</button>
    <button class="nav-btn" data-page="logs">記録</button>
    <button class="nav-btn" data-page="settings">設定</button>
  </div>
</div>

<div class="modal-backdrop" id="foodModal">
  <div class="sheet">
    <div class="sheet-head"><h3>ごはんを記録</h3><button class="soft-btn" data-close>閉じる</button></div>
    <div class="field-grid">
      <div class="field wide"><label for="foodCalInput">カロリー kcal</label><input id="foodCalInput" type="number" step="1" placeholder="例: 700"></div>
    </div>
    <button class="submit" id="saveFoodBtn" type="button">エサを作る</button>
  </div>
</div>

<div class="modal-backdrop" id="exerciseModal">
  <div class="sheet">
    <div class="sheet-head"><h3>運動を記録</h3><button class="soft-btn" data-close>閉じる</button></div>
    <div class="choice-grid" id="exerciseChoices"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="sprites.js"></script>
<script>
const STORAGE_KEY='mogu-room-pixel-v2';
const PETS=[
  {key:'hamster',name:'ミントハムスター',voice:'ちゅ',say:['きょうもいっしょだちゅ。','おなかのようすをみるちゅ。','もぐもぐしたいちゅ。']},
  {key:'rabbit',name:'ラベンダーうさぎ',voice:'ぴょん',say:['のんびりいこうぴょん。','ゆっくりでもだいじぴょん。','おしゃべりうれしいぴょん。']},
  {key:'squirrel',name:'ピーチりす',voice:'りす',say:['きょうもふわっといくりす。','たべるじかんかなりす。','いっしょにがんばるりす。']},
  {key:'hedgehog',name:'ほしのハリネズミ',voice:'きら',say:['きらっとお世話ありがと。','星みたいにかるくいこう。','いい感じだよ、きら。']},
  {key:'otter',name:'ペリウィンクルカワウソ',voice:'ぷか',say:['ぷかぷかいい日だぷか。','のんびりでも進んでるぷか。','ちょっと食べたいぷか。']}
];
const FOOD_CATALOG=[
  {key:'ramen',name:'ラーメン',kcal:700},{key:'bento',name:'おべんとう',kcal:500},{key:'cake',name:'ケーキ',kcal:350},
  {key:'chicken',name:'チキン',kcal:250},{key:'donut',name:'ドーナツ',kcal:230},{key:'onigiri',name:'おにぎり',kcal:200},
  {key:'bread',name:'パン',kcal:160},{key:'milk',name:'ミルク',kcal:130},{key:'salad',name:'サラダ',kcal:80},
  {key:'apple',name:'りんご',kcal:100},{key:'fish',name:'おさかな',kcal:180},{key:'cookie',name:'クッキー',kcal:50}
];
const EXERCISES=[
  {key:'walk',name:'ウォーキング',burn:120,label:'てくてく歩いたよ'},
  {key:'strength',name:'筋トレ',burn:180,label:'ダンベルで筋トレしたよ'},
  {key:'swim',name:'水泳',burn:220,label:'すいすい泳いだよ'},
  {key:'dance',name:'ダンス',burn:160,label:'リズムにのって動いたよ'},
  {key:'yoga',name:'ヨガ',burn:90,label:'ゆっくり伸びたよ'}
];
const FACE_POINTS={hamster:{x:21,y:9},rabbit:{x:19,y:15},squirrel:{x:19,y:14},hedgehog:{x:19,y:12},otter:{x:20,y:11}};
const BODY_RANGES={hamster:{cheek:[7,12],belly:[13,32]},rabbit:{cheek:[15,22],belly:[24,56]},squirrel:{cheek:[20,27],belly:[28,49]},hedgehog:{cheek:[14,18],belly:[19,44]},otter:{cheek:[9,15],belly:[16,34]}};
let dragData=null, toastTimer=null, actionTimer=null;

function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function emptyState(){return {
  date: today(), petIndex:1, foodPieces:[], meals:[], feedings:[], exercises:[], weights:[],
  profile:{height:'',weight:'',age:'',sex:'female',activity:'1.2'}, targets:null, profileHash:'', face:'neutral'
}}
function load(){
  try{const raw=localStorage.getItem(STORAGE_KEY); if(!raw) return emptyState();
    return {...emptyState(), ...JSON.parse(raw), profile:{...emptyState().profile,...(JSON.parse(raw).profile||{})}};
  }catch(e){return emptyState()}
}
let state=load();
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function ensureDay(){if(state.date!==today()){state.date=today();clearDaily();save();toast('日付が変わったのでリセットしたよ');renderAll();}}
function clearDaily(){state.foodPieces=[];state.meals=state.meals.filter(x=>x.date!==today());state.feedings=state.feedings.filter(x=>x.date!==today());state.exercises=state.exercises.filter(x=>x.date!==today())}
function q(s){return document.querySelector(s)}
function qa(s){return [...document.querySelectorAll(s)]}
function toast(msg){const el=q('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
function netCalories(){return Math.max(0,fedCalories()-exerciseCalories())}
function fedCalories(){return state.feedings.filter(x=>x.date===today()).reduce((a,b)=>a+b.kcal,0)}
function exerciseCalories(){return state.exercises.filter(x=>x.date===today()).reduce((a,b)=>a+b.burn,0)}
function profileHash(p){return JSON.stringify([p.height,p.weight,p.age,p.sex,p.activity])}
function calcTargets(){
  const p=state.profile; const h=Number(p.height), w=Number(p.weight), age=Number(p.age), act=Number(p.activity); if(!(h&&w&&age&&act)) return null;
  const bmr=p.sex==='male' ? 10*w + 6.25*h - 5*age + 5 : 10*w + 6.25*h - 5*age - 161;
  const maintain=Math.round(bmr*act); return {lose:[Math.round(maintain-500), Math.round(maintain-150)], maintain:[Math.round(maintain-149), Math.round(maintain+149)], gain:[Math.round(maintain+150), Math.round(maintain+500)]};
}
function bodyStage(){
  const n=netCalories(); if(!state.targets||n===0) return 'normal';
  const t=state.targets;
  if(n>=t.maintain[0] && n<=t.maintain[1]) return 'normal';
  if(n<t.maintain[0]){
    const p=Math.max(0,Math.min(1,n/Math.max(1,t.lose[1])));
    return p<.34 ? 'thin3' : p<.67 ? 'thin2' : 'thin1';
  }
  const p=(n-t.gain[0])/Math.max(1,(t.gain[1]-t.gain[0]));
  return p<.34 ? 'chubby1' : p<.67 ? 'chubby2' : 'chubby3';
}
function deformation(stage){return ({thin3:-3,thin2:-2,thin1:-1,normal:0,chubby1:1,chubby2:2,chubby3:3})[stage]||0}
function drawPet(){
  const pet=PETS[state.petIndex], info=spriteInfo(pet.key), rows=SPRITES[pet.key], canvas=q('#petCanvas'), scale=4;
  canvas.width=info.width*scale + 56; canvas.height=info.height*scale + 36;
  canvas.style.width=Math.min(240, Math.max(140, info.width*scale*1.15))+'px';
  canvas.style.height='auto';
  const ctx=canvas.getContext('2d'); ctx.imageSmoothingEnabled=false; ctx.clearRect(0,0,canvas.width,canvas.height);
  const off=document.createElement('canvas'); off.width=info.width; off.height=info.height; const octx=off.getContext('2d'); octx.imageSmoothingEnabled=false; drawSprite(octx,pet.key,1);
  const stage=bodyStage(), def=deformation(stage), ranges=BODY_RANGES[pet.key];
  const baseX=Math.floor((canvas.width - info.width*scale)/2), baseY=14;
  for(let y=0;y<info.height;y++){
    let rowWidth=info.width;
    const inCheek = y>=ranges.cheek[0] && y<=ranges.cheek[1];
    const inBelly = y>=ranges.belly[0] && y<=ranges.belly[1];
    let extra=0;
    if(def!==0){
      if(inCheek) extra += def*2;
      if(inBelly) extra += def*2.8;
    }
    rowWidth = Math.max(18, info.width + extra);
    const dx = Math.floor((canvas.width - rowWidth*scale)/2);
    ctx.drawImage(off,0,y,info.width,1,dx,baseY+y*scale,rowWidth*scale,scale);
  }
  drawFaceReaction(ctx, pet.key, scale, baseX, baseY, state.face);
}
function drawFaceReaction(ctx,key,scale,baseX,baseY,face){
  if(face==='neutral') return;
  const p=FACE_POINTS[key]; const x=baseX + p.x*scale; const y=baseY + p.y*scale;
  ctx.fillStyle=SPRITE_PALETTE.K;
  if(face==='blink' || face==='wink'){ctx.fillRect(x-12,y+2,10,2);}
  if(face==='happy' || face==='smile'){ctx.fillStyle='#efb7c7'; ctx.fillRect(x-16,y+10,8,2); ctx.fillRect(x+16,y+10,8,2);}
  if(face==='surprised'){ctx.fillStyle=SPRITE_PALETTE.K; ctx.fillRect(x+4,y+10,4,8);}
}
function drawFoodCanvas(canvas,name){const info=foodSpriteInfo(name), px=4; canvas.width=info.width*px; canvas.height=info.height*px; drawFoodSprite(canvas.getContext('2d'),name,px)}
function renderTray(){
  const tray=q('#foodTray'); q('#foodCount').textContent=`${state.foodPieces.length}個`;
  if(!state.foodPieces.length){ tray.innerHTML='<div class="empty">ごはんを記録するとエサがここに並ぶよ</div>'; return; }
  tray.innerHTML=state.foodPieces.map((piece,i)=>`<div class="food-item" data-i="${i}" aria-label="${piece.name}"><canvas></canvas></div>`).join('');
  qa('#foodTray .food-item').forEach((el,idx)=>{
    drawFoodCanvas(el.querySelector('canvas'), state.foodPieces[idx].key);
    bindDrag(el, idx);
  });
}
function chooseFoods(kcal){
  let remaining=kcal; const pieces=[];
  const sorted=[...FOOD_CATALOG].sort((a,b)=>b.kcal-a.kcal);
  while(remaining>0){
    let picked=sorted.find(item=>item.kcal<=remaining+30);
    if(!picked) picked=sorted[sorted.length-1];
    pieces.push({key:picked.key,name:picked.name,kcal:Math.min(remaining,picked.kcal)});
    remaining-=picked.kcal; if(remaining<40) break;
    if(pieces.length>6) break;
  }
  if(remaining>0 && pieces.length<7){const last=sorted.find(item=>item.kcal<=Math.max(remaining,80)) || sorted[sorted.length-1]; pieces.push({key:last.key,name:last.name,kcal:remaining})}
  return pieces;
}
function renderGauge(){
  const n=netCalories(); q('#netKcal').textContent=n;
  if(!state.targets){ q('#topTitle').textContent='プロフィールを設定'; q('#gaugeFill').style.clipPath='inset(0 100% 0 0)'; q('#targetText').textContent=''; return; }
  q('#topTitle').textContent='今日のカロリー収支';
  const max=Math.max(1,state.targets.gain[1]); const pct=Math.min(100,n/max*100); q('#gaugeFill').style.clipPath='inset(0 '+(100-pct)+'% 0 0)';
  q('#targetText').textContent=`減量 ${state.targets.lose[0]}〜${state.targets.lose[1]} kcal / 維持 ${state.targets.maintain[0]}〜${state.targets.maintain[1]} kcal / 増量 ${state.targets.gain[0]}〜${state.targets.gain[1]} kcal`;
}
function renderLogs(){
  const meals=state.meals.filter(x=>x.date===today()), ex=state.exercises.filter(x=>x.date===today());
  q('#mealList').innerHTML = meals.length ? meals.map(x=>`<div class="list-item"><span>${x.kcal} kcal</span><span class="muted">${x.pieces.join('・')}</span></div>`).join('') : '<div class="muted">まだ記録がないよ</div>';
  q('#exerciseList').innerHTML = ex.length ? ex.map(x=>`<div class="list-item"><span>${x.name}</span><span class="muted">-${x.burn} kcal</span></div>`).join('') : '<div class="muted">まだ記録がないよ</div>';
  q('#weightList').innerHTML = state.weights.length ? state.weights.slice().reverse().map(x=>`<div class="list-item"><span>${x.date}</span><span class="muted">${x.weight} kg</span></div>`).join('') : '<div class="muted">まだ記録がないよ</div>';
}
function renderPetPicker(){
  q('#petPicker').innerHTML=PETS.map((pet,i)=>`<button class="pet-option ${i===state.petIndex?'selected':''}" data-pet="${i}"><canvas width="80" height="120"></canvas><strong>${pet.name}</strong></button>`).join('');
  qa('#petPicker .pet-option').forEach((btn,i)=>{
    const cv=btn.querySelector('canvas'); const off=document.createElement('canvas'); off.width=40; off.height=60; drawPetThumbnail(cv,PETS[i].key);
    btn.addEventListener('click',()=>{state.petIndex=i; save(); renderAll();});
  });
}
function drawPetThumbnail(canvas,key){
  const info=spriteInfo(key), scale=2, ctx=canvas.getContext('2d'); ctx.imageSmoothingEnabled=false; ctx.clearRect(0,0,canvas.width,canvas.height);
  const off=document.createElement('canvas'); off.width=info.width; off.height=info.height; drawSprite(off.getContext('2d'), key, 1);
  const x=Math.floor((canvas.width - info.width*scale)/2), y=Math.floor((canvas.height - info.height*scale)/2);
  ctx.drawImage(off,0,0,info.width,info.height,x,y,info.width*scale,info.height*scale);
}
function renderSpeech(text){q('#speech').textContent=text || 'タップしておしゃべり'}
function speak(custom){
  const pet=PETS[state.petIndex]; const lines=pet.say; const message=custom || lines[Math.floor(Math.random()*lines.length)] ;
  state.face=['happy','blink','surprised','wink','smile','neutral'][Math.floor(Math.random()*6)]; renderSpeech(message); drawPet(); save(); clearTimeout(actionTimer); actionTimer=setTimeout(()=>{state.face='neutral'; drawPet();},1800);
}
function bindDrag(item, idx){
  const start=(clientX,clientY)=>{dragData={idx,startEl:item,ghost:item.cloneNode(true),x:clientX,y:clientY}; dragData.ghost.style.position='fixed'; dragData.ghost.style.left=(clientX-35)+'px'; dragData.ghost.style.top=(clientY-35)+'px'; dragData.ghost.style.zIndex='60'; dragData.ghost.style.pointerEvents='none'; document.body.appendChild(dragData.ghost);};
  const move=(clientX,clientY)=>{ if(!dragData) return; dragData.ghost.style.left=(clientX-35)+'px'; dragData.ghost.style.top=(clientY-35)+'px'; };
  const end=(clientX,clientY)=>{ if(!dragData) return; const r=q('#petCanvas').getBoundingClientRect(); const hit=clientX>=r.left+r.width*.3 && clientX<=r.left+r.width*.7 && clientY>=r.top+r.height*.25 && clientY<=r.top+r.height*.65;
    dragData.ghost.remove(); if(hit){ const piece=state.foodPieces.splice(idx,1)[0]; state.feedings.push({date:today(),kcal:piece.kcal,name:piece.name}); save(); renderTray(); renderGauge(); drawPet(); speak(`${piece.name}をもぐもぐした${PETS[state.petIndex].voice}。`);} else {toast('口元まで運んでね')} dragData=null; };
  item.addEventListener('touchstart',e=>{const t=e.touches[0];start(t.clientX,t.clientY)},{passive:true});
  item.addEventListener('touchmove',e=>{if(!dragData)return;const t=e.touches[0];move(t.clientX,t.clientY)},{passive:true});
  item.addEventListener('touchend',e=>{if(!dragData)return;const t=e.changedTouches[0];end(t.clientX,t.clientY)});
  item.addEventListener('mousedown',e=>{e.preventDefault();start(e.clientX,e.clientY);const mm=ev=>move(ev.clientX,ev.clientY);const mu=ev=>{document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);end(ev.clientX,ev.clientY)};document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu)});
}
function openModal(id){q(id).classList.add('show')} function closeModals(){qa('.modal-backdrop').forEach(m=>m.classList.remove('show'))}
function renderExerciseChoices(){ q('#exerciseChoices').innerHTML=EXERCISES.map((x,i)=>`<button class="choice-btn" data-ex="${x.key}"><span class="title">${x.name}</span><span class="muted">-${x.burn} kcal</span></button>`).join(''); qa('[data-ex]').forEach(btn=>btn.addEventListener('click',()=>saveExercise(btn.dataset.ex))); }
function animateExercise(kind){
  const cv=q('#fxLayer'); cv.width=q('#petStage').clientWidth; cv.height=q('#petStage').clientHeight; const ctx=cv.getContext('2d'); ctx.clearRect(0,0,cv.width,cv.height); ctx.imageSmoothingEnabled=false;
  const cx=cv.width/2, cy=cv.height/2;
  if(kind==='walk'){ctx.fillStyle='#9ab9a0'; for(let x=40;x<cv.width-40;x+=32){ctx.fillRect(x,cy+70,18,4)} }
  if(kind==='strength'){ctx.fillStyle='#66737b'; ctx.fillRect(cx-70,cy-10,40,8); ctx.fillRect(cx+30,cy-10,40,8); ctx.fillRect(cx-30,cy-2,60,4)}
  if(kind==='swim'){ctx.strokeStyle='#8cc7e3'; ctx.lineWidth=6; for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(20,cy+35+i*16); for(let x=20;x<cv.width-20;x+=24) ctx.lineTo(x+12, cy+35+i*16 + (x/24%2?6:-6)); ctx.stroke();}}
  if(kind==='dance'){ctx.fillStyle='#f0d777'; [[cx-70,cy-40],[cx+60,cy-20],[cx-30,cy+35]].forEach(([x,y])=>{ctx.fillRect(x,y,10,10);ctx.fillRect(x+10,y-10,10,10);ctx.fillRect(x+20,y,10,10);ctx.fillRect(x+10,y+10,10,10);})}
  if(kind==='yoga'){ctx.fillStyle='#bacfb6'; ctx.fillRect(cx-70,cy+55,140,10)}
  setTimeout(()=>ctx.clearRect(0,0,cv.width,cv.height),1600);
}
function saveFood(){ ensureDay(); const kcal=Number(q('#foodCalInput').value); if(!(kcal>0)){toast('カロリーを入力してね');return;} const pieces=chooseFoods(kcal); state.meals.push({date:today(),kcal,pieces:pieces.map(x=>x.name)}); state.foodPieces.push(...pieces); save(); q('#foodCalInput').value=''; closeModals(); renderTray(); renderLogs(); toast('エサを作ったよ'); }
function saveExercise(key){ ensureDay(); const ex=EXERCISES.find(x=>x.key===key); state.exercises.push({date:today(),...ex}); save(); closeModals(); renderGauge(); renderLogs(); animateExercise(key); speak(ex.label); }
function saveProfile(){ const p={height:q('#heightInput').value,weight:q('#weightInput').value,age:q('#ageInput').value,sex:q('#sexInput').value,activity:q('#activityInput').value}; const nextHash=profileHash(p); const changed=nextHash!==state.profileHash; state.profile=p; state.targets=calcTargets(); state.profileHash=nextHash; if(changed) clearDaily(); save(); renderAll(); toast(changed?'設定変更で今日のカロリーをリセットしたよ':'設定を更新したよ'); }
function saveWeight(){ const weight=q('#weightRecordInput').value; if(!weight){toast('体重を入力してね');return;} state.weights=state.weights.filter(x=>x.date!==today()); state.weights.push({date:today(),weight}); if(String(state.profile.weight)!==String(weight)){ state.profile.weight=String(weight); q('#weightInput').value=String(weight); state.targets=calcTargets(); state.profileHash=profileHash(state.profile); clearDaily(); }
 save(); renderAll(); toast('体重を保存したよ'); }
function resetToday(){ if(confirm('今日のカロリーとエサをゼロにする？')){ clearDaily(); save(); renderAll(); toast('リセットしたよ'); } }
function switchPage(page){ qa('.page').forEach(x=>x.classList.remove('active')); q(`#page-${page}`).classList.add('active'); qa('.nav-btn').forEach(x=>x.classList.toggle('active', x.dataset.page===page)); }
function renderAll(){ ensureDay(); q('#petName').textContent=PETS[state.petIndex].name; drawPet(); renderTray(); renderGauge(); renderLogs(); renderPetPicker(); renderSpeech();
  q('#heightInput').value=state.profile.height; q('#weightInput').value=state.profile.weight; q('#ageInput').value=state.profile.age; q('#sexInput').value=state.profile.sex; q('#activityInput').value=state.profile.activity; q('#weightRecordInput').value=''; }

q('#petCanvas').addEventListener('click',()=>speak());
q('#openFoodBtn').addEventListener('click',()=>openModal('#foodModal'));
q('#openExerciseBtn').addEventListener('click',()=>openModal('#exerciseModal'));
q('#saveFoodBtn').addEventListener('click',saveFood);
q('#saveProfileBtn').addEventListener('click',saveProfile);
q('#saveWeightBtn').addEventListener('click',saveWeight);
q('#resetBtn').addEventListener('click',resetToday);
q('#toLogsBtn').addEventListener('click',()=>switchPage('logs'));
qa('[data-close]').forEach(btn=>btn.addEventListener('click',closeModals));
qa('.modal-backdrop').forEach(bg=>bg.addEventListener('click',e=>{if(e.target===bg)closeModals()}));
qa('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>switchPage(btn.dataset.page)));
renderExerciseChoices();
state.targets=state.targets || calcTargets();
window.addEventListener('focus',ensureDay); document.addEventListener('visibilitychange',()=>{if(!document.hidden)ensureDay()});
renderAll();
</script>
</body>
</html>
